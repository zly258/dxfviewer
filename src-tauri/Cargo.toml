[package]
name = "dxfviewer-desktop"
version = "1.5.4"
description = "DXF 施工图查看器桌面客户端"
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
# 单文件体积优化：小体积优先，构建时间略增
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
