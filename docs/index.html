<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAD Viewer</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
     * 设计令牌（与 zly258/3dbrowser 同一套视觉语言）
     * 底：#F8FAFC / 面：#FFFFFF / 胶囊槽：#F1F5F9 / 分割线：#E2E8F0
     * 主操作蓝：#2563EB / 下拉选中：#EFF6FF + #2563EB + ✓
     * ========================================================================= */
    :root {
      --font-sans: 'Nunito', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --bg-app: #F8FAFC;
      --bg-chrome: #FFFFFF;
      --bg-band: #F1F5F9;
      --bg-glass: rgba(255, 255, 255, 0.95);
      --border-main: #E2E8F0;
      --border-sub: #F1F5F9;
      --text-main: #1E293B;
      --text-sec: #475569;
      --text-muted: #5B6472;
      --text-faint: #94A3B8;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
      --accent-line: #BFDBFE;
      --radius-xs: 4px;
      --radius: 6px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-pill: 9999px;
      --header-h: 44px;
      --header-h-compact: 36px;
      --footer-h: 24px;
      --sidebar-left-w: 224px;
      --sidebar-right-w: 288px;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-overlay: 0 10px 15px -3px rgba(15, 23, 42, 0.10), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
      --shadow-panel: 0 12px 28px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.06);
      --z-dock: 45;
      --z-sheet: 40;
      --z-dropdown: 60;
      --z-toast: 80;
    }

    *, *::before, *::after {
      cursor: default !important;
      font-family: var(--font-sans);
      box-sizing: border-box;
    }

    html, body { height: 100%; }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* 移动端用 dvh，避免地址栏伸缩导致视口跳动 */
    body.mode-portrait, body.mode-landscape { height: 100dvh; }

    /* 输入框恢复文本光标（全局默认光标只约束界面控件） */
    input, textarea, [contenteditable="true"] {
      cursor: text !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

    /* ---------- MD3 6px 胶囊滚动条（半透明 slate） ---------- */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; margin: 4px; }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.48);
      border-radius: 9999px;
      border: 1.5px solid transparent;
      background-clip: padding-box;
      transition: background-color 0.15s ease;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.8); }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* ---------- 顶栏：44px 三区（PC） ---------- */
    #appHeader {
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 12px;
      gap: 8px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border-main);
    }
    .tb-left, .tb-center, .tb-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .tb-left { flex: 1 1 0; gap: 8px; }
    .tb-center { flex: 0 0 auto; justify-content: center; padding: 0 8px; }
    .tb-right { flex: 1 1 0; justify-content: flex-end; gap: 6px; }

    /* 图标+文字胶囊：统一 26px 高、1 倍行高、图标与文字光学垂直居中 */
    .tb-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      min-height: 26px;
      padding: 0 10px;
      gap: 5px;
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--bg-band);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .tb-pill:hover { background: var(--border-main); color: var(--text-main); }
    .tb-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tb-pill svg, .tb-pill .tb-swatch { display: block; flex-shrink: 0; }
    .tb-pill > span { display: inline-flex; align-items: center; line-height: 1; height: 1em; }
    .tb-pill.tb-icon { width: 26px; padding: 0; background: transparent; }
    .tb-pill.tb-icon:hover { background: var(--bg-band); }
    .tb-pill.tb-primary { background: var(--accent); color: #FFFFFF; font-weight: 600; }
    .tb-pill.tb-primary:hover { background: var(--accent-hover); color: #FFFFFF; }

    /* 分段胶囊槽 */
    .tb-seg {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 2px;
      gap: 2px;
      background: var(--bg-band);
      border-radius: var(--radius-pill);
    }
    .tb-seg .tb-pill {
      height: 26px;
      min-height: 26px;
      padding: 0 12px;
      background: transparent;
      color: var(--text-sec);
    }
    .tb-seg .tb-pill:hover { background: rgba(226, 232, 240, 0.72); color: var(--text-main); }
    .tb-seg .tb-pill.is-active {
      background: #FFFFFF;
      color: var(--text-main);
      font-weight: 600;
      box-shadow: var(--shadow-card);
    }
    .tb-seg .tb-pill.is-active:hover { background: #FFFFFF; color: var(--text-main); }

    /* ---------- 下拉菜单（毛玻璃卡） ---------- */
    .theme-opt-btn,
    .sample-opt-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 6px 10px;
      border: 0;
      border-radius: var(--radius-lg);
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .theme-opt-btn:hover,
    .sample-opt-btn:hover { background: var(--bg-band); color: var(--text-main); }
    .theme-opt-btn.is-active,
    .sample-opt-btn.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .theme-opt-btn > span:first-child {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .sample-opt-btn > span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .theme-opt-btn .opt-swatch {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      flex-shrink: 0;
      display: block;
    }
    .opt-swatch-light { background: #FFFFFF; border: 1px solid #CBD5E1; }
    .opt-swatch-dark { background: #0F172A; border: 1px solid #334155; }
    .opt-swatch-bw { background: linear-gradient(90deg, #FFFFFF 50%, #0F172A 50%); border: 1px solid #CBD5E1; }
    .theme-swatch-bw { background: linear-gradient(90deg, #FFFFFF 50%, #0F172A 50%); border: 1px solid #94A3B8; }

    /* 搜索分类胶囊 */
    .search-cat-btn {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-sec);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .search-cat-btn:hover { background: var(--bg-band); color: var(--text-main); }
    .search-cat-btn.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    /* ---------- 侧栏 ---------- */
    .panel-head {
      flex: 0 0 auto;
      height: 32px;
      min-height: 32px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border-main);
    }
    .panel-search {
      flex: 0 0 auto;
      padding: 6px 10px;
      background: rgba(248, 250, 252, 0.6);
      border-bottom: 1px solid var(--border-sub);
    }
    #layerDrawer { background: var(--bg-chrome); border-right: 1px solid var(--border-main); }
    #propertyDrawer { background: var(--bg-chrome); border-left: 1px solid var(--border-main); }
    /* Touch gestures on the canvas are handled explicitly (pan/zoom/tap). */
    #threeCanvasContainer, #threeCanvasContainer canvas { touch-action: none; }

    .panel-resizer {
      width: 5px;
      flex-shrink: 0;
      background: transparent;
      position: relative;
      z-index: 20;
      transition: background-color 0.12s ease;
    }
    .panel-resizer:hover,
    .panel-resizer.is-dragging { background: rgba(37, 99, 235, 0.35); }
    .panel-resizer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -3px;
      right: -3px;
    }
    body.is-resizing-panel { user-select: none !important; }

    /* ---------- 底栏 ---------- */
    #appStatusBar {
      flex: 0 0 var(--footer-h);
      height: var(--footer-h);
      min-height: var(--footer-h);
      padding: 0 12px;
      gap: 12px;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border-main);
      font-size: 11px;
      line-height: 1;
      color: var(--text-muted);
    }
    .status-hint { color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- 空属性状态 ---------- */
    .prop-empty {
      min-height: 192px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 16px;
      text-align: center;
    }
    .prop-empty-icon {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-band);
      color: var(--text-faint);
    }
    .prop-empty-icon svg { width: 20px; height: 20px; display: block; }
    .prop-empty-title { font-size: 12px; font-weight: 600; color: var(--text-sec); }
    .prop-empty-hint { font-size: 11px; color: var(--text-muted); line-height: 1.6; max-width: 208px; }

    /* ---------- 移动竖屏：底部居中悬浮毛玻璃胶囊栏 ---------- */
    .mobile-dock { display: none; }
    .mobile-sheet { display: none; }
    .mobile-dock { transition: bottom 0.18s ease; }

    .mode-portrait .mobile-dock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: absolute;
      left: 50%;
      bottom: calc(var(--footer-h) + 12px);
      transform: translateX(-50%);
      z-index: var(--z-dock);
      padding: 3px;
      background: var(--bg-glass);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-panel);
    }
    .mode-portrait .mobile-dock .tb-seg { height: 28px; padding: 1px; }
    .mode-portrait .mobile-dock .tb-pill { height: 26px; min-height: 26px; padding: 0 10px; }

    /* ---------- 移动竖屏：底部上滑抽屉（图层 | 对象属性） ---------- */
    .mode-portrait .mobile-sheet {
      display: flex;
      flex-direction: column;
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--footer-h);
      z-index: var(--z-sheet);
      max-height: 55dvh;
      background: var(--bg-chrome);
      border-top: 1px solid var(--border-main);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: var(--shadow-panel);
      transform: translateY(100%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.22s ease, visibility 0s linear 0.22s;
    }
    .mode-portrait .mobile-sheet.is-open {
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
      transition: transform 0.22s ease, visibility 0s;
    }
    .mobile-sheet-handle {
      flex: 0 0 auto;
      width: 36px;
      height: 4px;
      margin: 8px auto 4px;
      background: #CBD5E1;
      border-radius: var(--radius-pill);
    }
    .mobile-sheet-tabs {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px 6px;
    }
    .sheet-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .sheet-tab:hover { background: var(--bg-band); color: var(--text-main); }
    .sheet-tab.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .mobile-sheet-body { flex: 1 1 auto; min-height: 0; display: flex; }
    .sheet-panel { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
    .sheet-panel.is-active { display: flex; }
    .mode-portrait .mobile-sheet .sheet-panel > aside {
      width: 100% !important;
      max-width: 100% !important;
      flex: 1 1 auto;
      min-height: 0;
      border: 0;
      border-radius: 0;
    }

    /* ---------- 移动竖屏：顶栏压缩 ---------- */
    .mode-portrait #appHeader {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .mode-portrait .tb-center { display: none; }
    .mode-portrait .tb-left { min-width: 0; gap: 6px; }
    .mode-portrait .tb-right {
      min-width: 0;
      width: 100%;
      gap: 1px;
      justify-content: flex-start;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .mode-portrait .tb-right::-webkit-scrollbar { display: none; }
    .mode-portrait #brandTitle,
    .mode-portrait #brandSep { display: none; }
    .mode-portrait #currentFileNameBadge { max-width: 64px; }
    .mode-portrait .tb-pill { height: 26px; padding: 0 5px; gap: 3px; font-size: 11px; }
    .mode-portrait .tb-right > * { flex: 0 0 auto; }
    /* 待 JS 把按钮搬运到底部胶囊栏之前，先隐藏原位副本，避免首帧重复 */
    .mode-portrait #headerTools > #btnToggleSearchPanel { display: none; }
    .mode-portrait main > #layerDrawer,
    .mode-portrait main > #propertyDrawer { display: none; }
    .mode-portrait .panel-resizer { display: none !important; }
    .mode-portrait .status-hint { display: none !important; }
    .mode-portrait #toastBanner { bottom: calc(var(--footer-h) + 56px); }
    .mode-portrait #themeDropdownMenu,
    .mode-portrait #sampleDropdownMenu {
      position: fixed;
      top: calc(var(--header-h) + 6px);
      right: 8px;
      left: auto;
      margin-top: 0;
      z-index: var(--z-dropdown);
      max-width: calc(100vw - 16px);
    }
    .mode-portrait #sampleDropdownMenu { width: min(320px, calc(100vw - 16px)); }
    .mode-portrait #searchFloatingPanel {
      left: 12px;
      right: 12px;
      top: 12px;
      width: auto;
      max-width: none;
    }

    /* ---------- 移动横屏：36px 顶栏 + 左右毛玻璃悬浮卡 ---------- */
    .mode-landscape #appHeader {
      height: var(--header-h-compact);
      min-height: var(--header-h-compact);
      padding: 0 8px;
      gap: 6px;
    }
    .mode-landscape .tb-center { padding: 0 4px; }
    .mode-landscape .tb-seg { height: 28px; padding: 1px; }
    .mode-landscape .tb-seg .tb-pill { height: 26px; min-height: 26px; padding: 0 10px; }
    .mode-landscape .tb-right { gap: 4px; }
    .mode-landscape .tb-pill { padding: 0 6px; gap: 4px; font-size: 11px; }
    .mode-landscape .status-hint { display: none !important; }
    .mode-landscape .panel-resizer { display: none !important; }
    .mode-landscape #layerDrawer,
    .mode-landscape #propertyDrawer {
      position: absolute;
      top: 8px;
      bottom: calc(var(--footer-h) + 8px);
      z-index: var(--z-dock);
      display: flex;
      background: var(--bg-glass);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }
    .mode-landscape #layerDrawer { left: 8px; width: 192px !important; max-width: 192px !important; }
    .mode-landscape #propertyDrawer { right: 8px; width: 232px !important; max-width: 232px !important; }
    .mode-landscape #layerDrawer .panel-head,
    .mode-landscape #propertyDrawer .panel-head { height: 30px; min-height: 30px; padding: 0 8px; }
    .mode-landscape #layerDrawer .panel-head .text-xs,
    .mode-landscape #propertyDrawer .panel-head .text-xs { font-size: 11px; }
    .mode-landscape #layerDrawer .panel-head button,
    .mode-landscape #propertyDrawer .panel-head button { font-size: 11px; }

    /* 超窄手机（≤380px）：主题按钮只留色板+箭头，保证 5 个按钮同屏 */
    @media (max-width: 380px) {
      .mode-portrait #lblCurrentTheme { display: none; }
    }
    /* ---------- 窄桌面 / 平板：压缩胶囊，保证三区不重叠 ---------- */
    @media (max-width: 1199px) and (min-height: 501px) {
      .tb-pill { padding: 0 6px; gap: 4px; font-size: 11px; }
      .tb-right { gap: 4px; }
    }
    @media (max-width: 1023px) and (min-height: 501px) {
      .tb-left { flex: 0 1 auto; }
      .tb-right { flex: 1 1 auto; }
    }
    /* 768–819px 的窄桌面：收起品牌名，给文件名与右侧工具留出空间 */
    @media (max-width: 819px) and (min-height: 501px) {
      #brandTitle, #brandSep { display: none; }
    }

  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none bg-slate-50 text-slate-800">
  <script>
    /* 首帧即锁定三端布局模式，避免移动端先闪一帧桌面三栏 */
    (function () {
      var w = window.innerWidth, h = window.innerHeight;
      var mode = (h < 500) ? 'landscape' : (w < 768 ? 'portrait' : 'desktop');
      document.body.classList.add('mode-' + mode);
    })();
  </script>

  <!-- Top Bar -->
  <header id="appHeader" class="bg-white border-b border-slate-200 flex items-center shrink-0 z-30 relative">
    <!-- Left: Layer Drawer Toggle + Brand + Truncated File Name -->
    <div class="tb-left">
      <button id="btnToggleDrawer" type="button" class="tb-pill tb-icon" title="图层 / Layers" aria-label="图层 / Layers">
        <svg class="w-4 h-4 block shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span id="brandTitle" class="font-semibold text-xs tracking-tight text-slate-900 shrink-0 leading-none">CAD Viewer</span>
      <span id="brandSep" class="text-slate-300 shrink-0 leading-none">/</span>
      <span id="currentFileNameBadge" class="text-xs font-medium text-slate-600 mono truncate max-w-[220px]" title="planetary_gearbox_2d.dxf">planetary_gearbox_2d.dxf</span>
    </div>

    <!-- Center: View Switcher (2D / 3D / 适应); pick/box are unified AutoCAD gestures (no mode toggle) -->
    <div id="headerCenter" class="tb-center">
      <div id="viewSegGroup" class="tb-seg">
        <button id="btnViewTop" type="button" class="tb-pill is-active" aria-pressed="true">2D</button>
        <button id="btnViewIso" type="button" class="tb-pill" aria-pressed="false">3D</button>
        <button id="btnFitView" type="button" class="tb-pill">适应</button>
      </div>
    </div>

    <!-- Right: Search Button, White/Black Mode, Open DXF, Samples, Lang, Property Toggle -->
    <div id="headerTools" class="tb-right">
      <!-- Standalone Search Panel Trigger -->
      <button id="btnToggleSearchPanel" type="button" class="tb-pill" title="搜索 / Search" aria-controls="searchFloatingPanel" aria-expanded="false">
        <svg class="w-3.5 h-3.5 text-slate-500 block shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z"/>
        </svg>

      <!-- Standalone Closable Fuzzy Search & Locate Panel -->

        <div class="p-2.5 border-b border-slate-100 space-y-2">

    function rotateAroundPivot(dx, dy, pivot) {
      if (!activeCamera || !controls || !pivot) return;

      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      if (normals.length === positions.length) {
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      }
      const isLight = appState.bgTheme === 'light';
      const color = isLight ? 0x8B5CF6 : 0xC4B5FD;
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
        toneMapped: false
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.renderOrder = 999;
      mesh.frustumCulled = false;
      mesh.name = 'Selected3DHighlight';
      return mesh;
    }

    function _collectSelectedEdges(selectedIdSet) {
      const meshEdges = [];
      const lineEdges = [];
      if (!dxfRootGroup || !selectedIdSet || selectedIdSet.size === 0) {
        return { meshEdges, lineEdges };
      }
      const COS_CREASE = Math.cos(38 * Math.PI / 180);
      dxfRootGroup.updateMatrixWorld(true);
      const mw = new THREE.Matrix4();
      const va = new THREE.Vector3();
      const vb = new THREE.Vector3();
      const vc = new THREE.Vector3();
      const e1 = new THREE.Vector3();
      const e2 = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      dxfRootGroup.traverse(obj => {
        const pids = obj.userData && obj.userData.pickIds;
        const geom = obj.geometry;
        if (!pids || !geom) return;
        const pos = geom.getAttribute('position');
        if (!pos) return;
        const vCount = Math.min(pos.count, pids.length);
        mw.copy(obj.matrixWorld);

        if (obj.isMesh) {
          const edgeMap = new Map();
          const triCount = Math.floor(vCount / 3);
          for (let t = 0; t < triCount; t++) {
            const i0 = t * 3;
            const pid = pids[i0];
            if (!selectedIdSet.has(pid)) continue;
            va.fromBufferAttribute(pos, i0).applyMatrix4(mw);
            vb.fromBufferAttribute(pos, i0 + 1).applyMatrix4(mw);
            vc.fromBufferAttribute(pos, i0 + 2).applyMatrix4(mw);
            e1.subVectors(vb, va);
            e2.subVectors(vc, va);
            nrm.crossVectors(e1, e2);
            if (nrm.lengthSq() < 1e-20) continue;
            nrm.normalize();
            const verts = [va, vb, vc];
            for (let k = 0; k < 3; k++) {
              const p = verts[k], q = verts[(k + 1) % 3];
              const key = _edgeKey(p.x, p.y, p.z, q.x, q.y, q.z);
              let rec = edgeMap.get(key);
              if (!rec) {
                rec = {
                  ax: p.x, ay: p.y, az: p.z, bx: q.x, by: q.y, bz: q.z,
                  n1x: nrm.x, n1y: nrm.y, n1z: nrm.z, count: 1
                };
                edgeMap.set(key, rec);
              } else {
                rec.count += 1;
                const dot = rec.n1x * nrm.x + rec.n1y * nrm.y + rec.n1z * nrm.z;
                rec.sharp = rec.sharp || dot < COS_CREASE;
              }
            }
          }
          edgeMap.forEach(rec => {
            if (rec.count === 1 || rec.sharp) meshEdges.push(rec);
          });
        } else if (obj.isLine || obj.isLineSegments) {
          const segCount = Math.floor(vCount / 2);
          for (let s = 0; s < segCount; s++) {
            const i0 = s * 2;
            if (!selectedIdSet.has(pids[i0]) && !selectedIdSet.has(pids[i0 + 1])) continue;
            va.fromBufferAttribute(pos, i0).applyMatrix4(mw);
            vb.fromBufferAttribute(pos, i0 + 1).applyMatrix4(mw);
            lineEdges.push({ ax: va.x, ay: va.y, az: va.z, bx: vb.x, by: vb.y, bz: vb.z });
          }
        }
      });
      return { meshEdges, lineEdges };
    }

    function _makeLineSegments(edges, color, alwaysOnTop) {
      if (!edges.length) return null;
      const arr = new Float32Array(edges.length * 6);
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const o = i * 6;
        arr[o] = e.ax; arr[o + 1] = e.ay; arr[o + 2] = e.az;
        arr[o + 3] = e.bx; arr[o + 4] = e.by; arr[o + 5] = e.bz;
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      const mat = new THREE.LineBasicMaterial({
        color,
        depthTest: !alwaysOnTop,
        depthWrite: false,
        transparent: alwaysOnTop,
        opacity: alwaysOnTop ? 0.35 : 1,
        toneMapped: false
      });
      const lines = new THREE.LineSegments(geom, mat);
      lines.renderOrder = alwaysOnTop ? 1002 : 1000;
      lines.frustumCulled = false;
      return lines;
    }

    function _makeFatRibbonMesh(edges, color, pixelWidth, atPoint) {
      if (!edges.length) return null;
      const wpp = getWorldUnitsPerPixel(atPoint);
      const half = Math.max(wpp * pixelWidth * 0.5, wpp * 0.8);
      const camPos = activeCamera ? activeCamera.position : new THREE.Vector3(0, 0, 1);
      const preferZ = (appState.viewMode === 'top');
      const positions = new Float32Array(edges.length * 6 * 3);
      const dir = new THREE.Vector3();
      const mid = new THREE.Vector3();
      const side = new THREE.Vector3();
      const view = new THREE.Vector3();
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      let nvert = 0;
      const put = (x, y, z) => {
        const o = nvert * 3;
        positions[o] = x; positions[o + 1] = y; positions[o + 2] = z;
        nvert++;
      };
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        a.set(e.ax, e.ay, e.az);
        b.set(e.bx, e.by, e.bz);
        dir.subVectors(b, a);
        if (dir.lengthSq() < 1e-16) continue;
        mid.addVectors(a, b).multiplyScalar(0.5);
        if (preferZ) {
          side.set(-dir.y, dir.x, 0);
          if (side.lengthSq() < 1e-16) side.set(1, 0, 0);
        } else {
          view.subVectors(camPos, mid);
          side.crossVectors(dir, view);
          if (side.lengthSq() < 1e-16) side.set(-dir.y, dir.x, 0);
        }
        side.normalize().multiplyScalar(half);
        const a1x = a.x + side.x, a1y = a.y + side.y, a1z = a.z + side.z;
        const a2x = a.x - side.x, a2y = a.y - side.y, a2z = a.z - side.z;
        const b1x = b.x + side.x, b1y = b.y + side.y, b1z = b.z + side.z;
        const b2x = b.x - side.x, b2y = b.y - side.y, b2z = b.z - side.z;
        put(a1x, a1y, a1z); put(b1x, b1y, b1z); put(a2x, a2y, a2z);
        put(a2x, a2y, a2z); put(b1x, b1y, b1z); put(b2x, b2y, b2z);
      }
      if (nvert === 0) return null;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, nvert * 3), 3));
      const mat = new THREE.MeshBasicMaterial({
        color,
        depthTest: true,
        depthWrite: false,
        transparent: false,
        side: THREE.DoubleSide,
        toneMapped: false,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.renderOrder = 1001;
      mesh.frustumCulled = false;
      mesh.userData.isFatOutline = true;
      return mesh;
    }

    function refreshFatOutlineWidths(force) {
      if (!selectionOutlineGroup || !_fatOutlineEdges || !_fatOutlineEdges.length) return;
      const at = controls ? controls.target : new THREE.Vector3();
      const wpp = getWorldUnitsPerPixel(at);
      if (!force && _fatOutlinePixelSize && Math.abs(wpp - _fatOutlinePixelSize) / _fatOutlinePixelSize < 0.08) {
        if (appState.viewMode === 'top') return;
      }
      const isLight = appState.bgTheme === 'light';
      const borderColor = isLight ? 0x111827 : 0xFFFFFF;
      const olds = [];
      selectionOutlineGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.isFatOutline) olds.push(ch);
      });
      olds.forEach(ch => {
        selectionOutlineGroup.remove(ch);
        if (ch.geometry) ch.geometry.dispose();
        if (ch.material) ch.material.dispose();
      });
      const fat = _makeFatRibbonMesh(_fatOutlineEdges, borderColor, 2.8, at);
      if (fat) selectionOutlineGroup.add(fat);
      _fatOutlinePixelSize = wpp;
    }


    function _makeSelectionBoundingBox(box, color) {
      const min = box.min, max = box.max;
      const corners = [
        [min.x, min.y, min.z], [max.x, min.y, min.z],
        [max.x, max.y, min.z], [min.x, max.y, min.z],
        [min.x, min.y, max.z], [max.x, min.y, max.z],
        [max.x, max.y, max.z], [min.x, max.y, max.z]
      ];
      const edges = [
        [0, 1], [1, 2], [2, 3], [3, 0],
        [4, 5], [5, 6], [6, 7], [7, 4],
        [0, 4], [1, 5], [2, 6], [3, 7]
      ];
      const arr = new Float32Array(edges.length * 6);
      for (let i = 0; i < edges.length; i++) {
        const a = corners[edges[i][0]];
        const b = corners[edges[i][1]];
        const o = i * 6;
        arr[o] = a[0]; arr[o + 1] = a[1]; arr[o + 2] = a[2];
        arr[o + 3] = b[0]; arr[o + 4] = b[1]; arr[o + 5] = b[2];
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      if (geom.computeLineDistances) geom.computeLineDistances();
      const diag = min.distanceTo(max);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const wpp = getWorldUnitsPerPixel(center);
      const dash = Math.max(diag * 0.045, wpp * 10);
      const mat = new THREE.LineDashedMaterial({
        color,
        dashSize: dash,
        gapSize: dash * 0.65,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 0.95,
        toneMapped: false
      });
      const lines = new THREE.LineSegments(geom, mat);
      lines.renderOrder = 1020;
      lines.frustumCulled = false;
      lines.userData.isSelectionBox = true;
      return lines;
    }

    function computeSelectionWorldBox(selectedIdSet, records) {
      const box = new THREE.Box3();
      let found = false;
      let missingBox = false;
      // Fast path: every pick record already carries its world-space box, so a
      // selection does not need to walk every vertex in the drawing.
      if (records && records.length) {
        records.forEach(r => {
          if (r && r.box && !r.box.isEmpty()) { box.union(r.box); found = true; }
          else missingBox = true;
        });
      }
      if (found && !missingBox) return box;
      // Fallback (or partial records without boxes): derive from geometry, and
      // union with the boxes already collected so nothing is dropped.
      if (dxfRootGroup && selectedIdSet && selectedIdSet.size > 0) {
        const va = new THREE.Vector3();
        dxfRootGroup.updateMatrixWorld(true);
        dxfRootGroup.traverse(obj => {
          const pids = obj.userData && obj.userData.pickIds;
          if (!pids || !obj.geometry) return;
          const pos = obj.geometry.getAttribute('position');
          if (!pos) return;
          const mw = obj.matrixWorld;
          const n = Math.min(pos.count, pids.length);
          for (let i = 0; i < n; i++) {
            if (!selectedIdSet.has(pids[i])) continue;
            va.fromBufferAttribute(pos, i).applyMatrix4(mw);
            if (!Number.isFinite(va.x) || !Number.isFinite(va.y) || !Number.isFinite(va.z)) continue;
            box.expandByPoint(va);
            found = true;
          }
        });
      }
      return found ? box : null;
    }

    function addSelectionBoundingBoxes(group, records, selectedIdSet) {
      if (!group) return;
      const raw = computeSelectionWorldBox(selectedIdSet, records);
      if (!raw || raw.isEmpty()) return;
      const isLight = appState.bgTheme === 'light';
      const color = isLight ? 0x8B5CF6 : 0xC4B5FD;
      const box = raw.clone();
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const wpp = getWorldUnitsPerPixel(center);
      const pad = Math.min(Math.max(size.x, size.y, size.z) * 0.015, wpp * 8) + wpp * 3;
      box.expandByScalar(pad);
      group.add(_makeSelectionBoundingBox(box, color));
    }

    function updateSelectionOutlines(selectedIdSet) {
      disposeSelectionOutlines();
      if (!scene) return;
      const records = (appState.selectedRecords || []).filter(Boolean);
      const hasSel = (selectedIdSet && selectedIdSet.size > 0) || records.length > 0;
      if (!hasSel) return;

      selectionOutlineGroup = new THREE.Group();
      selectionOutlineGroup.name = 'SelectionOutline';
      selectionOutlineGroup.renderOrder = 1000;
      // Additive highlight overlay for selected 3D solids (drawn under the outlines).
      const solidHighlight = _buildSelected3DHighlight(selectedIdSet);
      if (solidHighlight) selectionOutlineGroup.add(solidHighlight);
      addSelectionBoundingBoxes(selectionOutlineGroup, records, selectedIdSet);
      if (selectionOutlineGroup.children.length) {
        scene.add(selectionOutlineGroup);
      } else {
        selectionOutlineGroup = null;
      }
    }

    function t(key, ...args) {
      const dict = I18N[appState.lang] || I18N.zh;
      const val = dict[key];
      return typeof val === 'function' ? val(...args) : (val || key);
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function escapeHtml(str) {
      return String(str === undefined || str === null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setFileNameDisplay(name) {

      const badge = document.getElementById('currentFileNameBadge');

        badge.textContent = name;
        badge.title = name;

    // A local file is not one of the presets; drop the check mark so the menu
    // does not keep highlighting the previously loaded sample.
    function markSamplePresetActive(key) {
      document.querySelectorAll('.sample-opt-btn').forEach(b => {
        const isAct = !!key && b.getAttribute('data-preset') === key;
        b.classList.toggle('is-active', isAct);
        const c = b.querySelector('.sample-check');
        if (c) c.classList.toggle('hidden', !isAct);

    function updateLoadingProgressUI(visible, percent = 0, stage = '', detail = '') {
      const card = document.getElementById('loadingOverlayCard');
      const topTrack = document.getElementById('topProgressTrack');
      const topFill = document.getElementById('topProgressFill');
      const barFill = document.getElementById('loadingBarFill');
      const pctText = document.getElementById('loadingPercentText');
      const stageTitle = document.getElementById('loadingStageTitle');
      const detailText = document.getElementById('loadingDetailText');

      if (!visible) {
        if (card) card.classList.add('hidden');
        if (topTrack) topTrack.classList.add('hidden');
        return;
      }
      if (card) card.classList.remove('hidden');
      if (topTrack) topTrack.classList.remove('hidden');
      const clamped = Math.max(0, Math.min(100, Math.round(percent)));
      if (topFill) topFill.style.width = `${clamped}%`;
      if (barFill) barFill.style.width = `${clamped}%`;
      if (pctText) pctText.textContent = `${clamped}%`;
      if (stage && stageTitle) stageTitle.textContent = stage;
      if (detailText) detailText.textContent = detail || '';
    }

    /**
     * OrbitControls: left pick/box, middle pan, right rotate in 3D; 2D locks rotation (right also pans).
     */
    function createCleanOrbitControls(camera, domElement, targetVec) {
      if (controls) {
        controls.dispose();
      }
      controls = new THREE.OrbitControls(camera, domElement);
      controls.enableDamping = false;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.15;
      controls.panSpeed = 1.0;
      controls.rotateSpeed = 0.85;

      const is2D = (appState.viewMode === 'top');
      // Touch-only devices get native OrbitControls pinch-zoom / two-finger pan;
      // desktop keeps the custom wheel zoom that stays under the cursor.
      const isTouchOnly = !!(window.matchMedia &&
        window.matchMedia('(pointer: coarse)').matches &&
        !window.matchMedia('(pointer: fine)').matches);
      controls.enableRotate = !is2D;
      controls.enableZoom = isTouchOnly;
      controls.enablePan = true;
      controls.touches.ONE = is2D ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
      // Left: pick / box; middle: pan; right: 2D pan, 3D custom orbit around cursor.
      controls.mouseButtons = {
        LEFT: -1,
        MIDDLE: THREE.MOUSE.PAN,
        RIGHT: is2D ? THREE.MOUSE.PAN : -1
      };
      controls.addEventListener('change', requestRender);

      controls.enabled = true;
      if (targetVec) {
        controls.target.copy(targetVec);
      }
      controls.update();
    }

    function setInteractionMode(_mode) {
      // Unified AutoCAD gestures: no pick/box mode toggle; keep as no-op for compatibility.
      appState.interactionMode = 'unified';
      if (controls) controls.enabled = true;
    }

    function initThreeViewport() {
      const container = document.getElementById('threeCanvasContainer');
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 600;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(appState.bgTheme === 'light' ? 0xFFFFFF : 0x000000);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 0.82);
      hemiLight.position.set(0, 0, 300);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.65);
      dirLight1.position.set(160, -180, 260);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
      dirLight2.position.set(-160, 140, -120);
      scene.add(dirLight2);

      const aspect = w / Math.max(1, h);
      perspCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 10000000);
      perspCamera.position.set(0, 0, 220);
      perspCamera.up.set(0, 1, 0);

      const frustumSize = 180;
      orthoCamera = new THREE.OrthographicCamera(
        (-frustumSize * aspect) / 2,
        (frustumSize * aspect) / 2,
        frustumSize / 2,
        -frustumSize / 2,
        -100000,
        100000
      );
      orthoCamera.position.set(0, 0, 220);
      orthoCamera.up.set(0, 1, 0);

      activeCamera = orthoCamera;

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      // Correct colour management: CAD colours are authored in sRGB, so the
      // renderer must re-encode them on output, otherwise every layer colour
      // looks washed out compared to AutoCAD. Guarded for older three.js
      // builds that still use `outputEncoding`.
      try {
        if ('outputColorSpace' in renderer && THREE.SRGBColorSpace !== undefined) {
          renderer.outputColorSpace = THREE.SRGBColorSpace;
        } else if (renderer.outputEncoding !== undefined && THREE.sRGBEncoding !== undefined) {
          renderer.outputEncoding = THREE.sRGBEncoding;
        }
        if ('toneMapping' in renderer && THREE.NoToneMapping !== undefined) {
          // ACES tone mapping desaturates the vivid ACI colours, so keep it off.
          renderer.toneMapping = THREE.NoToneMapping;
        }
      } catch (e) {
        console.warn('Colour management setup skipped:', e && e.message);
      }
      if ('setPixelRatio' in renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
      }
      renderer.setSize(w, h);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      createCleanOrbitControls(activeCamera, renderer.domElement, new THREE.Vector3(0, 0, 0));

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      renderer.domElement.addEventListener('pointercancel', onPointerCancel);
      renderer.domElement.addEventListener('click', onViewportClick);

      // Touch devices: OrbitControls owns pan/pinch; a short, still tap selects.
      let touchTap = null;
      renderer.domElement.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'touch') return;
        if (!e.isPrimary) { touchTap = null; return; }
        touchTap = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'touch') return;
        if (!touchTap || touchTap.id !== e.pointerId) { touchTap = null; return; }
        const tap = touchTap;
        touchTap = null;
        const dist = Math.hypot(e.clientX - tap.x, e.clientY - tap.y);
        if (dist <= 8 && performance.now() - tap.t <= 600) {
          pickAtClientPoint(e.clientX, e.clientY);
        }
      });
      renderer.domElement.addEventListener('pointercancel', (e) => {
        if (e.pointerType === 'touch') touchTap = null;
      });
      renderer.domElement.addEventListener('wheel', onViewportWheel, { passive: false });
      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('resize', onWindowResize);

      window.addEventListener('dragover', (e) => { e.preventDefault(); });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        if (!/\.(dxf|txt)$/i.test(file.name)) {
          showToast(appState.lang === 'zh' ? '请拖入 .dxf 或 .txt 文件' : 'Drop a .dxf or .txt file');
          return;
        }
        if (file.size > 200 * 1024 * 1024) {
          showToast(appState.lang === 'zh' ? '文件超过 200 MB，请先拆分' : 'File is larger than 200 MB');
          return;
        }
        loadUploadedFile(file);
      });

      requestRender();
    }

    // ---------------------------------------------------------------------
    // Render on demand: the scene is static between interactions, so drawing
    // every animation frame just burns GPU/battery. Anything that changes the
    // scene or camera calls requestRender(); outline widths refresh only while
    // a selection is visible.
    // ---------------------------------------------------------------------
    let _renderPending = false;

    function requestRender() {
      if (_renderPending) return;
      _renderPending = true;
      requestAnimationFrame(() => {
        _renderPending = false;
        if (selectionOutlineGroup && _fatOutlineEdges) {
          refreshFatOutlineWidths(false);
        }
        if (renderer && scene && activeCamera) {
          renderer.render(scene, activeCamera);
        }
      });
    }

    // One resize pass per frame even though the mode handler and the resizer
    // both call onWindowResize().
    let _canvasResizeFrame = 0;
    function onWindowResize() {
      if (_canvasResizeFrame) return;
      _canvasResizeFrame = requestAnimationFrame(() => {
        _canvasResizeFrame = 0;
        applyCanvasSizeToViewport();
      });
    }

    function applyCanvasSizeToViewport() {
      const container = document.getElementById('threeCanvasContainer');
      if (!container || !renderer) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w <= 0 || h <= 0) return;

      const aspect = w / h;
      perspCamera.aspect = aspect;
      perspCamera.updateProjectionMatrix();

      const frustumH = orthoCamera.top - orthoCamera.bottom;
      orthoCamera.left = (-frustumH * aspect) / 2;
      orthoCamera.right = (frustumH * aspect) / 2;
      orthoCamera.updateProjectionMatrix();

      // Keep the backing store in sync when the window moves between displays
      // with different devicePixelRatio (otherwise the canvas turns blurry).
      if ('setPixelRatio' in renderer && 'getPixelRatio' in renderer) {
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        if (renderer.getPixelRatio() !== dpr) renderer.setPixelRatio(dpr);
      }
      renderer.setSize(w, h);
      requestRender();
    }

    // =========================================================================
    // Pointer & AutoCAD Window / Crossing Box Selection
    // =========================================================================
    function onPointerDown(e) {
      // Touch navigation (pan / pinch-zoom) is owned by OrbitControls; the
      // custom marquee gesture stays mouse/pen only so the two never fight.
      if (e.pointerType === 'touch') return;
      if (e.button === 2 && controls && controls.enableRotate && appState.viewMode === 'iso') {
        e.preventDefault();
        const pivot = pickPivotUnderPointer(e.clientX, e.clientY);
        if (pivot) {
          cadOrbit.active = true;
          cadOrbit.pivot.copy(pivot);
          cadOrbit.lastX = e.clientX;
          cadOrbit.lastY = e.clientY;
          if (renderer.domElement.setPointerCapture) {
            try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          }
        }
        return;
      }
      if (e.button !== 0) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerDragState.isDown = true;
      pointerDragState.downX = e.clientX - rect.left;
      pointerDragState.downY = e.clientY - rect.top;
      pointerDragState.curX = pointerDragState.downX;
      pointerDragState.curY = pointerDragState.downY;
      pointerDragState.boxActive = false;
      pointerDragState.pendingBox = true;
      // Do NOT disable OrbitControls here — wheel zoom must keep working during box drag.
    }

    function updateBoxOverlayDOM() {
      const overlay = document.getElementById('selectionBoxOverlay');
      if (!overlay) return;

      const x0 = Math.min(pointerDragState.downX, pointerDragState.curX);
      const y0 = Math.min(pointerDragState.downY, pointerDragState.curY);
      const w = Math.abs(pointerDragState.curX - pointerDragState.downX);
      const h = Math.abs(pointerDragState.curY - pointerDragState.downY);
      const isWindowMode = pointerDragState.curX >= pointerDragState.downX;

      overlay.style.left = `${x0}px`;
      overlay.style.top = `${y0}px`;
      overlay.style.width = `${w}px`;
      overlay.style.height = `${h}px`;

      if (isWindowMode) {
        overlay.style.border = '1.5px solid #2563EB';
        overlay.style.backgroundColor = 'rgba(37, 99, 235, 0.12)';
      } else {
        overlay.style.border = '1.5px dashed #10B981';
        overlay.style.backgroundColor = 'rgba(16, 185, 129, 0.14)';
      }
    }

    function onPointerMove(e) {
      if (e.pointerType === 'touch') return;
      lastPointerEvent = e;
      if (cadOrbit.active) {
        const dx = e.clientX - cadOrbit.lastX;
        const dy = e.clientY - cadOrbit.lastY;
        cadOrbit.lastX = e.clientX;
        cadOrbit.lastY = e.clientY;
        rotateAroundPivot(dx, dy, cadOrbit.pivot);
        return;
      }
      if (pointerDragState.isDown && renderer) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointerDragState.curX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        pointerDragState.curY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
        if (pointerDragState.pendingBox && !pointerDragState.boxActive) {
          const dx0 = Math.abs(pointerDragState.curX - pointerDragState.downX);
          const dy0 = Math.abs(pointerDragState.curY - pointerDragState.downY);
          if (dx0 >= 4 || dy0 >= 4) {
            pointerDragState.boxActive = true;
            const overlay = document.getElementById('selectionBoxOverlay');
            if (overlay) overlay.classList.remove('hidden');
          }
        }
        if (pointerDragState.boxActive) {
          updateBoxOverlayDOM();
        }
      }

      if (pointerRafPending) return;
      pointerRafPending = true;
      requestAnimationFrame(() => {
        pointerRafPending = false;
        if (!lastPointerEvent || !renderer) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((lastPointerEvent.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((lastPointerEvent.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, activeCamera);
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(planeZ, hit)) {
          const shift = (appState.parsedResult && appState.parsedResult.originShift) || { x: 0, y: 0, z: 0 };
          const readout = document.getElementById('cursorCoordsReadout');
          if (readout) {
            readout.textContent = `X: ${(hit.x + shift.x).toFixed(2)}  Y: ${(hit.y + shift.y).toFixed(2)}`;
          }
        }
      });
    }

    function onPointerUp(e) {
      if (e.pointerType === 'touch') return;
      if (cadOrbit.active) {
        cadOrbit.active = false;
        if (renderer && renderer.domElement.releasePointerCapture) {
          try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        }
        return;
      }
      if (!pointerDragState.isDown) return;
      pointerDragState.isDown = false;
      pointerDragState.pendingBox = false;
      const dx = Math.abs(pointerDragState.curX - pointerDragState.downX);
      const dy = Math.abs(pointerDragState.curY - pointerDragState.downY);

      if (pointerDragState.boxActive) {
        pointerDragState.boxActive = false;
        const overlay = document.getElementById('selectionBoxOverlay');
        if (overlay) overlay.classList.add('hidden');
        // Keep controls.enabled = true so wheel zoom never drops out of box select.

        if (dx >= 4 || dy >= 4) {
          pointerDragState.suppressNextClick = true;
          setTimeout(() => { pointerDragState.suppressNextClick = false; }, 80);
          performBoxSelection(
            pointerDragState.downX,
            pointerDragState.downY,
            pointerDragState.curX,
            pointerDragState.curY
          );
        }
      } else if (dx > 5 || dy > 5) {
        // Accidental drag without box activation — suppress click-selection
        pointerDragState.suppressNextClick = true;
        setTimeout(() => { pointerDragState.suppressNextClick = false; }, 60);
      }
      // Small movement: leave click event for point pick
    }

    // A cancelled touch/pen gesture must not leave the marquee overlay or the
    // "pointer is down" state stuck.
    function onPointerCancel(e) {
      if (cadOrbit.active) {
        cadOrbit.active = false;
        if (renderer && renderer.domElement.releasePointerCapture) {
          try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        }
      }
      if (!pointerDragState.isDown) return;
      pointerDragState.isDown = false;
      pointerDragState.boxActive = false;
      pointerDragState.pendingBox = false;
      const overlay = document.getElementById('selectionBoxOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    // =========================================================================
    // Exact 2D Screen-Space Geometry Math for Precision Point & Crossing Selection
    // =========================================================================
    function distToSegmentSq2D(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 < 1e-6) return (px - x1) * (px - x1) + (py - y1) * (py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      return (px - projX) * (px - projX) + (py - projY) * (py - projY);
    }

    function pointInTriangle2D(px, py, x0, y0, x1, y1, x2, y2) {
      const dX = px - x2, dY = py - y2;
      const dX21 = x2 - x1, dY12 = y1 - y2;
      const D = dY12 * (x0 - x2) + dX21 * (y0 - y2);
      if (Math.abs(D) < 1e-7) return false;
      const s = dY12 * dX + dX21 * dY;
      const t = (y2 - y0) * dX + (x0 - x2) * dY;
      if (D < 0) return s <= 0.01 && t <= 0.01 && s + t >= D - 0.01;
      return s >= -0.01 && t >= -0.01 && s + t <= D + 0.01;
    }

    function segmentIntersectsRect2D(x1, y1, x2, y2, minX, minY, maxX, maxY) {
      if ((x1 >= minX && x1 <= maxX && y1 >= minY && y1 <= maxY) ||
          (x2 >= minX && x2 <= maxX && y2 >= minY && y2 <= maxY)) return true;
      if (Math.max(x1, x2) < minX || Math.min(x1, x2) > maxX ||
          Math.max(y1, y2) < minY || Math.min(y1, y2) > maxY) return false;
      const dx = x2 - x1, dy = y2 - y1;
      let t0 = 0, t1 = 1;
      const p = [-dx, dx, -dy, dy];
      const q = [x1 - minX, maxX - x1, y1 - minY, maxY - y1];
      for (let i = 0; i < 4; i++) {
        if (Math.abs(p[i]) < 1e-9) {
          if (q[i] < 0) return false;
        } else {
          const r = q[i] / p[i];
          if (p[i] < 0) {
            if (r > t1) return false;
            if (r > t0) t0 = r;
          } else {
            if (r < t0) return false;
            if (r < t1) t1 = r;
          }
        }
      }
      return t0 <= t1;
    }

    function performBoxSelection(x1, y1, x2, y2) {
      if (!appState.parsedResult || !appState.parsedResult.pickRecords || !renderer) return;
      const isWindow = x2 >= x1;
      const minX = Math.min(x1, x2);
      const maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2);
      const maxY = Math.max(y1, y2);

      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 600;

      const records = appState.parsedResult.pickRecords;
      const layers = appState.parsedResult.layers;
      const matchedIds = new Set();
      const partialCrossingCandidates = new Set();

      const corners = [
        new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(),
        new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
      ];

      // Broad-phase via the screen-space index: only the records whose
      // projected bounds touch the marquee are tested. Projecting 100k+
      // bounding boxes froze box selection on huge drawings.
      let searchIds = null;
      const sIndex = ensureScreenPickIndex();
      if (sIndex && records.length > 300) {
        searchIds = queryScreenPickIndex(sIndex, minX, minY, maxX, maxY);
      }

      const visitRecord = (i, fn) => {
        if (searchIds && !searchIds.has(i)) return;
        fn(i);
      };

      for (let i = 0; i < records.length; i++) visitRecord(i, (i) => {
        const rec = records[i];
        if (rec.isNestedText) return;
        const lg = layers[rec.layer];
        if (lg && !lg.visible) return;

        const b = rec.box;
        if (!b || b.isEmpty()) return;

        // The screen-space index already holds the projected bounds, so the
        // marquee test needs no further projection of the world box.
        let eMinX, eMinY, eMaxX, eMaxY;
        const sb = sIndex ? sIndex.boxes[i] : null;
        if (sb) {
          eMinX = sb.x0; eMinY = sb.y0; eMaxX = sb.x1; eMaxY = sb.y1;
        } else {
          corners[0].set(b.min.x, b.min.y, b.min.z);
          corners[1].set(b.max.x, b.min.y, b.min.z);
          corners[2].set(b.max.x, b.max.y, b.min.z);
          corners[3].set(b.min.x, b.max.y, b.min.z);
          corners[4].set(b.min.x, b.min.y, b.max.z);
          corners[5].set(b.max.x, b.min.y, b.max.z);
          corners[6].set(b.max.x, b.max.y, b.max.z);
          corners[7].set(b.min.x, b.max.y, b.max.z);

          eMinX = Infinity; eMinY = Infinity; eMaxX = -Infinity; eMaxY = -Infinity;
          for (let c = 0; c < 8; c++) {
            const v = corners[c].project(activeCamera);
            const sx = (v.x * 0.5 + 0.5) * width;
            const sy = (-v.y * 0.5 + 0.5) * height;
            if (sx < eMinX) eMinX = sx;
            if (sy < eMinY) eMinY = sy;
            if (sx > eMaxX) eMaxX = sx;
            if (sy > eMaxY) eMaxY = sy;
          }
        }

        const strictlyInside = (eMinX >= minX && eMaxX <= maxX && eMinY >= minY && eMaxY <= maxY);
        if (strictlyInside) {
          matchedIds.add(rec.id);
        } else if (!isWindow && eMaxX >= minX && eMinX <= maxX && eMaxY >= minY && eMinY <= maxY) {
          partialCrossingCandidates.add(rec.id);
        }
      });

      // For Crossing mode (Right->Left), verify actual segment/triangle intersection so hollow outer rectangles aren't falsely selected!
      if (!isWindow && partialCrossingCandidates.size > 0 && partialCrossingCandidates.size <= 4000 && dxfRootGroup) {
        const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
        dxfRootGroup.traverse(obj => {
          if (!obj.visible || (obj.parent && !obj.parent.visible)) return;
          if (!obj.geometry || !obj.userData || !obj.userData.pickIds) return;
          const posAttr = obj.geometry.getAttribute('position');
          if (!posAttr) return;
          const pos = posAttr.array;
          const pids = obj.userData.pickIds;

          if (obj.isLineSegments) {
            for (let v = 0; v < pids.length; v += 2) {
              const pid = pids[v];
              if (!partialCrossingCandidates.has(pid) || matchedIds.has(pid)) continue;
              const i0 = v * 3, i1 = (v + 1) * 3;
              vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
              vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
              const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
              const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
              if (segmentIntersectsRect2D(sx0, sy0, sx1, sy1, minX, minY, maxX, maxY)) {
                matchedIds.add(pid);
              }
            }
          } else if (obj.isMesh) {
            for (let v = 0; v < pids.length; v += 3) {
              const pid = pids[v];
              if (!partialCrossingCandidates.has(pid) || matchedIds.has(pid)) continue;
              const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
              vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
              vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
              vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
              const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
              const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
              const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;
              if (segmentIntersectsRect2D(sx0, sy0, sx1, sy1, minX, minY, maxX, maxY) ||
                  segmentIntersectsRect2D(sx1, sy1, sx2, sy2, minX, minY, maxX, maxY) ||
                  segmentIntersectsRect2D(sx2, sy2, sx0, sy0, minX, minY, maxX, maxY) ||
                  pointInTriangle2D((minX + maxX) * 0.5, (minY + maxY) * 0.5, sx0, sy0, sx1, sy1, sx2, sy2)) {
                matchedIds.add(pid);
              }
            }
          }
        });
      }

      // Block references are selected as a whole (AutoCAD behaviour): a
      // member of an INSERT resolves to that INSERT, and the INSERT is
      // reported only once even when several of its members are inside
      // the marquee.
      const matchedMap = new Map();
      for (let i = 0; i < records.length; i++) {
        const r = records[i];
        if (r.isNestedText) continue;
        if (!matchedIds.has(r.id)) continue;
        const target = resolveBlockReferenceSelection(r);
        const key = target && target.entity ? target.entity : r;
        if (!matchedMap.has(key)) matchedMap.set(key, target);
      }
      const matched = Array.from(matchedMap.values());
      appState.multiSelectBackup = null;
      appState.multiTypeFilter = 'ALL';
      setSelectedRecords(matched);
    }

    /**
     * Precision CAD Point Picker ("点选不准，会被挡住，比如多段线，矩形")
     * Tests exact screen-space pixel distance to rendered line segments, text quads, and 3D/2D triangles
     * rather than selecting by hollow bounding boxes!
     */
    /**
     * Screen-space pick index.
     *
     * Testing every pick record against the pick ray (and projecting every
     * record's 8 corners for box selection) froze the main thread on huge
     * drawings, which made point and box selection feel dead. This index
     * stores each record's projected screen-space bounds, so the broad
     * phase is exact in the 2D and the 3D view alike and costs only what is
     * actually visible. The projection is recomputed when the camera moves.
     */
    function ensureScreenPickIndex() {
      const res = appState.parsedResult;
      if (!res || !res.pickRecords) return null;
      const cam = activeCamera;
      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 600;
      // Derive a stable cache key from the camera parameters that actually
      // affect the world-to-screen mapping. For the orthographic camera (2D
      // view) only the frustum and zoom matter; perspective cameras use the
      // full matrix. Rounding avoids false invalidations from OrbitControls
      // microdrift. The key also includes the canvas size.
      const r4 = (v) => Math.round(v * 1e4) / 1e4;
      let key;
      if (cam && cam.isOrthographicCamera) {
        key = `ortho:${r4(cam.left)},${r4(cam.right)},${r4(cam.top)},${r4(cam.bottom)},${r4(cam.zoom)},${r4(cam.position.x)},${r4(cam.position.y)}|${width}x${height}`;
      } else {
        key = (cam ? cam.matrixWorldInverse.elements.map(r4).join(',') + '|' + cam.projectionMatrix.elements.map(r4).join(',') : '')
          + '|' + width + 'x' + height;
      }
      if (res.screenPickIndex && res.screenPickIndex.key === key) return res.screenPickIndex;

      const records = res.pickRecords;
      const cellPx = 24;
      const cells = new Map();
      const boxes = new Array(records.length);

      // For an orthographic camera the mapping from world to screen is a pure
      // linear transform — projecting the two diagonal corners gives the exact
      // AABB with 4× fewer project() calls. Perspective cameras still need 8.
      const isOrtho = cam && cam.isOrthographicCamera;
      const vMin = new THREE.Vector3(), vMax = new THREE.Vector3(), vTmp = new THREE.Vector3();
      const corners = isOrtho ? null : new Array(8).fill(0).map(() => new THREE.Vector3());

      for (let i = 0; i < records.length; i++) {
        const rec = records[i];
        const b = rec.box;
        if (!b || b.isEmpty()) { boxes[i] = null; continue; }
        let sxMin, syMin, sxMax, syMax;
        if (isOrtho) {
          vMin.copy(b.min).project(cam);
          vMax.copy(b.max).project(cam);
          const ax = (vMin.x * 0.5 + 0.5) * width, ay = (-vMin.y * 0.5 + 0.5) * height;
          const bx = (vMax.x * 0.5 + 0.5) * width, by = (-vMax.y * 0.5 + 0.5) * height;
          sxMin = Math.min(ax, bx); sxMax = Math.max(ax, bx);
          syMin = Math.min(ay, by); syMax = Math.max(ay, by);
        } else {
          corners[0].set(b.min.x, b.min.y, b.min.z); corners[1].set(b.max.x, b.min.y, b.min.z);
          corners[2].set(b.max.x, b.max.y, b.min.z); corners[3].set(b.min.x, b.max.y, b.min.z);
          corners[4].set(b.min.x, b.min.y, b.max.z); corners[5].set(b.max.x, b.min.y, b.max.z);
          corners[6].set(b.max.x, b.max.y, b.max.z); corners[7].set(b.min.x, b.max.y, b.max.z);
          sxMin = Infinity; syMin = Infinity; sxMax = -Infinity; syMax = -Infinity;
          for (let c = 0; c < 8; c++) {
            vTmp.copy(corners[c]).project(cam);
            const sx = (vTmp.x * 0.5 + 0.5) * width, sy = (-vTmp.y * 0.5 + 0.5) * height;
            if (sx < sxMin) sxMin = sx; if (sy < syMin) syMin = sy;
            if (sx > sxMax) sxMax = sx; if (sy > syMax) syMax = sy;
          }
        }
        boxes[i] = { x0: sxMin, y0: syMin, x1: sxMax, y1: syMax };
        const cx0 = Math.floor(sxMin / cellPx), cx1 = Math.floor(sxMax / cellPx);
        const cy0 = Math.floor(syMin / cellPx), cy1 = Math.floor(syMax / cellPx);
        if (Math.max(cx1 - cx0, cy1 - cy0) > 200) continue;
        for (let cx = cx0; cx <= cx1; cx++) {
          for (let cy = cy0; cy <= cy1; cy++) {
            const k = cx + '_' + cy;
            let arr = cells.get(k);
            if (!arr) { arr = []; cells.set(k, arr); }
            arr.push(i);
          }
        }
      }
      res.screenPickIndex = { key, cellPx, cells, boxes };
      return res.screenPickIndex;
    }

    function queryScreenPickIndex(index, pxMin, pyMin, pxMax, pyMax) {
      const ids = new Set();
      if (!index) return ids;
      const cx0 = Math.floor(pxMin / index.cellPx), cx1 = Math.floor(pxMax / index.cellPx);
      const cy0 = Math.floor(pyMin / index.cellPx), cy1 = Math.floor(pyMax / index.cellPx);
      for (let cx = cx0; cx <= cx1; cx++) {
        for (let cy = cy0; cy <= cy1; cy++) {
          const arr = index.cells.get(cx + '_' + cy);
          if (!arr) continue;
          for (let k = 0; k < arr.length; k++) ids.add(arr[k]);
        }
      }
      return ids;
    }

    /**
     * Segment-level inverse index for the narrow pick phase.
     *
     * Without this, every click on a 160k-entity drawing walked all segments in
     * the batched geometry looking for the few candidates, turning picking into
     * an O(N) scan regardless of drawing complexity. This inverts the lookup
     * so only the segments that actually belong to candidate entities are tested.
     *
     * Built lazily once per parse; invalidated when dxfRootGroup changes.
     */
    function ensureSegmentIndex() {
      const res = appState.parsedResult;
      if (!res) return null;
      if (res.segmentIndex && res.segmentIndex.root === dxfRootGroup) return res.segmentIndex;
      if (!dxfRootGroup) return null;

      // pid → [{obj, v}]  where v is the even vertex index in pickIds
      const pidToSegs = new Map();
      dxfRootGroup.traverse(obj => {
        if (!obj.isLineSegments) return;
        if (!obj.geometry || !obj.userData || !obj.userData.pickIds) return;
        const pids = obj.userData.pickIds;
        for (let v = 0; v < pids.length; v += 2) {
          const pid = pids[v];
          let arr = pidToSegs.get(pid);
          if (!arr) { arr = []; pidToSegs.set(pid, arr); }
          arr.push({ obj, v });
        }
      });
      res.segmentIndex = { root: dxfRootGroup, pidToSegs };
      return res.segmentIndex;
    }

    /**
     * AutoCAD selects a block reference as a whole: clicking any entity that
     * belongs to an INSERT selects the INSERT itself, not the single member.
     */
    function resolveBlockReferenceSelection(rec) {
      if (!rec) return rec;
      const ent = rec.entity;
      if (!ent) return rec;
      const parentInsert = ent.parentInsert;
      if (!parentInsert || parentInsert === ent) return rec;
      const records = (appState.parsedResult && appState.parsedResult.pickRecords) || [];
      for (let i = 0; i < records.length; i++) {
        const r = records[i];
        if (r.entity === parentInsert) return r;
      }
      return {
        id: records.length,
        isTopLevel: true,
        entity: parentInsert,
        layer: rec.layer,
        displayLayer: rec.displayLayer,
        colorPair: rec.colorPair,
        box: rec.box
      };
    }
    function onViewportClick(e) {
      if (pointerDragState.suppressNextClick) return;
      pickAtClientPoint(e.clientX, e.clientY);
    }

    function pickAtClientPoint(clientX, clientY) {
      if (!appState.parsedResult || !appState.parsedResult.pickRecords || !renderer || !dxfRootGroup) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 600;
      const clickPxX = clientX - rect.left;
      const clickPxY = clientY - rect.top;

      mouse.x = (clickPxX / width) * 2 - 1;
      mouse.y = -(clickPxY / height) * 2 + 1;
      raycaster.setFromCamera(mouse, activeCamera);

      const ray = raycaster.ray;
      const records = appState.parsedResult.pickRecords;
      const layers = appState.parsedResult.layers;

      const worldWidth = ((orthoCamera.right - orthoCamera.left) / orthoCamera.zoom) || 100;
      const pickRadiusPx = 9.0;
      const pickRadiusSq = pickRadiusPx * pickRadiusPx;
      const worldTol = Math.max(0.5, (worldWidth / width) * (pickRadiusPx + 4.0));
      const padVec = new THREE.Vector3(worldTol, worldTol, worldTol + 8.0);

      // 1. Broad-phase filter: use the world-space grid index (built once per
      //    parse, never invalidated by camera changes). For each candidate
      //    whose world box intersects the pick ray (padded by the pick
      //    tolerance), add it to the candidate map. This is O(candidates)
      //    regardless of drawing size.
      const candidateMap = new Map();
      const tmpBox = new THREE.Box3();

      // Build a world-space grid over pickRecords (lazy, cached per parse).
      if (!appState.parsedResult.worldPickIndex) {
        const recs = records;
        let wMinX = Infinity, wMinY = Infinity, wMaxX = -Infinity, wMaxY = -Infinity;
        for (let i = 0; i < recs.length; i++) {
          const b = recs[i].box;
          if (!b || b.isEmpty()) continue;
          if (b.min.x < wMinX) wMinX = b.min.x;
          if (b.min.y < wMinY) wMinY = b.min.y;
          if (b.max.x > wMaxX) wMaxX = b.max.x;
          if (b.max.y > wMaxY) wMaxY = b.max.y;
        }
        const span = Math.max(wMaxX - wMinX, wMaxY - wMinY, 1);
        const wCell = Math.max(span / 256, 1e-3);
        const wCells = new Map();
        const wOversized = [];
        for (let i = 0; i < recs.length; i++) {
          const b = recs[i].box;
          if (!b || b.isEmpty()) continue;
          const x0 = Math.floor(b.min.x / wCell), x1 = Math.floor(b.max.x / wCell);
          const y0 = Math.floor(b.min.y / wCell), y1 = Math.floor(b.max.y / wCell);
          if (Math.max(x1 - x0, y1 - y0) > 96) { wOversized.push(i); continue; }
          for (let cx = x0; cx <= x1; cx++) {
            for (let cy = y0; cy <= y1; cy++) {
              const k = cx + '_' + cy;
              let arr = wCells.get(k);
              if (!arr) { arr = []; wCells.set(k, arr); }
              arr.push(i);
            }
          }
        }
        appState.parsedResult.worldPickIndex = { cell: wCell, cells: wCells, oversized: wOversized };
      }

      const wIdx = appState.parsedResult.worldPickIndex;
      if (wIdx && records.length > 300) {
        // Compute the world-space pick region: the cursor maps to a ray in
        // world space. For an orthographic camera the ray is constant-direction
        // (perpendicular to the screen for 2D top view), so we just need the
        // world X/Y at the cursor ± worldTol.
        const ndcX = (clickPxX / width) * 2 - 1;
        const ndcY = -(clickPxY / height) * 2 + 1;
        const wCenter = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(activeCamera);
        const wX = wCenter.x, wY = wCenter.y;
        const ids = new Set();
        const x0 = Math.floor((wX - worldTol) / wIdx.cell), x1 = Math.floor((wX + worldTol) / wIdx.cell);
        const y0 = Math.floor((wY - worldTol) / wIdx.cell), y1 = Math.floor((wY + worldTol) / wIdx.cell);
        for (let cx = x0; cx <= x1; cx++) {
          for (let cy = y0; cy <= y1; cy++) {
            const arr = wIdx.cells.get(cx + '_' + cy);
            if (!arr) continue;
            for (let k = 0; k < arr.length; k++) ids.add(arr[k]);
          }
        }
        for (let k = 0; k < wIdx.oversized.length; k++) ids.add(wIdx.oversized[k]);
        for (const i of ids) {
          const rec = records[i];
          const lg = layers[rec.layer];
          if (lg && !lg.visible) continue;
          tmpBox.copy(rec.box).expandByVector(padVec);
          if (ray.intersectsBox(tmpBox)) {
            candidateMap.set(rec.id, rec);
          }
        }
      } else {
        for (let i = 0; i < records.length; i++) {
          const rec = records[i];
          const lg = layers[rec.layer];
          if (lg && !lg.visible) continue;
          tmpBox.copy(rec.box).expandByVector(padVec);
          if (ray.intersectsBox(tmpBox)) {
            candidateMap.set(rec.id, rec);
          }
        }
      }

      if (candidateMap.size === 0) {
        // Empty-canvas click: drop the selection the same way ESC does.
        clearSelection();
        return;
      }

      // 2. Narrow-phase exact geometry hit testing in screen pixel space
      let bestEdgeRec = null;
      let bestEdgeDistSq = pickRadiusSq;
      let bestEdgeBoxDiag = Infinity;

      let bestTextRec = null;
      let bestTextDistSq = pickRadiusSq;
      let bestTextBoxDiag = Infinity;

      let bestSolid3DRec = null;
      let bestSolid3DDepth = Infinity;

      let bestHatchRec = null;
      let bestHatchBoxDiag = Infinity;

      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      const szVec = new THREE.Vector3();
      const getDiag = (r) => {
        if (!r || !r.box) return Infinity;
        r.box.getSize(szVec);
        return szVec.length();
      };

      // --- LineSegments: inverse segment index (O(candidates) not O(N)) ---
      // Iterate only the candidate entities; for each, look up exactly which
      // segments belong to it via the index. This keeps pick latency constant
      // at ~5 ms even on drawings with 100k+ line entities.
      const segIdx = ensureSegmentIndex();
      if (segIdx) {
        for (const [pid, rec] of candidateMap) {
          const segs = segIdx.pidToSegs.get(pid);
          if (!segs) continue;
          const isHatch = rec.entity && (rec.entity.type === 'HATCH' || rec.entity.type === 'MPOLYGON');
          for (const { obj, v } of segs) {
            if (!obj.visible) continue;
            const pos = obj.geometry.getAttribute('position').array;
            const i0 = v * 3, i1 = (v + 1) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const dSq = distToSegmentSq2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1);
            if (dSq <= pickRadiusSq) {
              if (isHatch) {
                const diag = getDiag(rec);
                if (diag < bestHatchBoxDiag) { bestHatchBoxDiag = diag; bestHatchRec = rec; }
              } else {
                const diag = getDiag(rec);
                if (dSq + 2.25 < bestEdgeDistSq || (Math.abs(dSq - bestEdgeDistSq) <= 2.25 && diag < bestEdgeBoxDiag)) {
                  bestEdgeDistSq = dSq; bestEdgeBoxDiag = diag; bestEdgeRec = rec;
                }
              }
            }
          }
        }
      }

      // --- Text atlas + 3D/2D mesh: traverse once (small batches in practice)
      // Skip entirely when all candidates are line-type entities (the common
      // case for drawings dominated by LINE/CIRCLE/ARC/LWPOLYLINE).
      let hasNonLineCandidates = false;
      for (const rec of candidateMap.values()) {
        const t = rec.entity && rec.entity.type;
        if (t !== 'LINE' && t !== 'CIRCLE' && t !== 'ARC' && t !== 'ELLIPSE' &&
            t !== 'SPLINE' && t !== 'LWPOLYLINE' && t !== 'POLYLINE' &&
            t !== 'XLINE' && t !== 'RAY' && t !== 'POINT' && t !== 'HATCH') {
          hasNonLineCandidates = true; break;
        }
      }
      if (hasNonLineCandidates) {
      dxfRootGroup.traverse(obj => {
        if (!obj.visible || (obj.parent && !obj.parent.visible)) return;
        if (!obj.geometry || !obj.userData || !obj.userData.pickIds) return;
        if (obj.isLineSegments) return; // already handled via segment index
        const posAttr = obj.geometry.getAttribute('position');
        if (!posAttr) return;
        const pos = posAttr.array;
        const pids = obj.userData.pickIds;
        if (obj.isMesh && obj.name && obj.name.startsWith('Batched_Text_Atlas')) {
          // Test rendered text quads
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const diag = getDiag(rec);
              if (diag < bestTextBoxDiag) {
                bestTextDistSq = 0;
                bestTextBoxDiag = diag;
                bestTextRec = rec;
              }
            }
          }
        } else if (obj.isMesh && obj.name && obj.name.startsWith('BatchedMesh3D')) {
          // Test 3D solid triangles (choose frontmost closest to camera)
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const zAvg = (vA.z + vB.z + vC.z) / 3.0;
              if (zAvg < bestSolid3DDepth) {
                bestSolid3DDepth = zAvg;
                bestSolid3DRec = rec;
              }
