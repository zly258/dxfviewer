            }
          }
        } else if (obj.isMesh && obj.name && obj.name.startsWith('BatchedMesh2D')) {
          // Test 2D filled triangles (thick polylines, SOLID, or HATCH fills)
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const isHatch = rec.entity && (rec.entity.type === 'HATCH' || rec.entity.type === 'MPOLYGON');
              if (!isHatch) {
                const diag = getDiag(rec);
                if (1.0 < bestEdgeDistSq || diag < bestEdgeBoxDiag) {
                  bestEdgeDistSq = 1.0;
                  bestEdgeBoxDiag = diag;
                  bestEdgeRec = rec;
                }
              } else {
                const diag = getDiag(rec);
                if (diag < bestHatchBoxDiag) {
                  bestHatchBoxDiag = diag;
                  bestHatchRec = rec;
                }
              }
            }
          }
        }
      });
      } // end if (hasNonLineCandidates)

      // Priority:
      // 1. Direct click on a Text quad or very close (< 4px) to an Edge
      // 2. Any Edge within the 9px pickbox aperture
      // 3. 3D Solid surface triangle
      // 4. Background Hatch fill (never blocks edges, polylines, rectangles, or text!)
      //
      // In the 3D (iso) view a solid surface is a large filled area, while the
      // wireframe edges that belong to it are thin and sit right on the
      // silhouette. Picking the edge first would therefore select the outline
      // instead of the solid the user actually aimed at, so in 3D the solid
      // surface wins over a nearby edge (text still wins over both).
      let winner = null;
      const preferSolid3D = appState.viewMode === 'iso' && bestSolid3DRec;
      if (bestTextRec && (!bestEdgeRec || bestEdgeDistSq > 9.0 || bestTextBoxDiag < bestEdgeBoxDiag)) {
        winner = bestTextRec;
      } else if (preferSolid3D && (!bestEdgeRec || bestEdgeDistSq > 4.0)) {
        winner = bestSolid3DRec;
      } else if (bestEdgeRec) {
        winner = bestEdgeRec;
      } else if (bestTextRec) {
        winner = bestTextRec;
      } else if (bestSolid3DRec) {
        winner = bestSolid3DRec;
      } else if (bestHatchRec) {
        winner = bestHatchRec;
      }

      appState.multiSelectBackup = null;
      appState.multiTypeFilter = 'ALL';
      setSelectedRecords(winner ? [resolveBlockReferenceSelection(winner)] : []);
    }

    // =========================================================================
    // Entity Color Highlighting ("高亮改成颜色高亮，而不是包围盒")
    // =========================================================================
    function setSelectedRecords(records) {
      appState.selectedRecords = records || [];

      const badge = document.getElementById('selectionCountBadge');
      if (badge) {
        if (appState.selectedRecords.length === 0) {
          badge.textContent = t('unselectedBadge');
          badge.className = 'text-slate-500 mono';
        } else {
          badge.textContent = t('selectedCountBadge', appState.selectedRecords.length);
          badge.className = 'text-blue-600 font-semibold mono';
        }
      }

      const selectedIdSet = new Set();
      appState.selectedRecords.forEach(r => {
        if (r && r.id !== undefined && r.id >= 0) selectedIdSet.add(r.id);
      });

      if (dxfRootGroup) {
        window.DXFLoader.applyBackgroundTheme(dxfRootGroup, appState.bgTheme, selectedIdSet);
      }
      updateSelectionOutlines(selectedIdSet);

      renderPropertyPanel();
      requestRender();
    }

    /**
     * Single place that drops the current selection: ESC, the 清除 button and a
     * click on empty canvas all go through here so the multi-select backup and
     * the type filter cannot be left behind.
     */
    function clearSelection() {
      appState.multiSelectBackup = null;
      appState.multiTypeFilter = 'ALL';
      if ((appState.selectedRecords || []).length === 0) {
        // Still normalise the panel so a stale multi-select view cannot linger.
        renderPropertyPanel();
        return;
      }
      setSelectedRecords([]);
    }

    // Keeping a hidden layer's entities selected leaves outlines and property
    // rows floating over invisible geometry; drop them when their layer hides.
    function pruneSelectionToVisibleLayers() {
      const res = appState.parsedResult;
      const sel = appState.selectedRecords || [];
      if (!res || sel.length === 0) return;
      const remain = sel.filter(r => {
        const key = (r && (r.layer || (r.entity && r.entity.layer))) || null;
        const lg = key ? res.layers[key] : null;
        return !lg || lg.visible !== false;
      });
      if (remain.length !== sel.length) {
        appState.multiSelectBackup = null;
        setSelectedRecords(remain);
      }
    }

    function zoomToBox(box) {
      if (!box || box.isEmpty() || !activeCamera || !renderer) return;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);

      const span = Math.max(size.x, size.y, size.z, 6.0);
      if (activeCamera === orthoCamera) {
        const baseFrustumH = orthoCamera.top - orthoCamera.bottom;
        const targetFrustumH = span * 2.8;
        orthoCamera.zoom = Math.max(0.05, Math.min(200, baseFrustumH / Math.max(1e-3, targetFrustumH)));
        orthoCamera.updateProjectionMatrix();
      }

      const offsetDir = new THREE.Vector3().subVectors(activeCamera.position, controls ? controls.target : new THREE.Vector3(0, 0, -1));
      if (offsetDir.lengthSq() < 1e-6) offsetDir.set(0, 0, 200);
      activeCamera.position.copy(center).add(offsetDir);
      if (controls) {
        controls.target.copy(center);
        controls.update();
      }
    }

    function zoomToSelectedRecords() {
      if (!appState.selectedRecords || appState.selectedRecords.length === 0) return;
      const unionBox = new THREE.Box3();
      appState.selectedRecords.forEach(r => {
        if (r && r.box && !r.box.isEmpty()) unionBox.union(r.box);
      });
      if (!unionBox.isEmpty()) zoomToBox(unionBox);
    }

    // =========================================================================
    // Standalone Fuzzy Search & Locate Engine (Text + Properties + Attributes)
    // =========================================================================
    function extractEntityPlainText(ent) {
      if (!ent) return '';
      if (ent.text) {
        return String(ent.text)
          .replace(/\\P/g, ' ')
          .replace(/\\[A-Za-z][^;]*;/g, '')
          .replace(/\{|\}/g, '')
          .trim();
      }
      if (ent.type === 'DIMENSION' && ent.actualMeasurement !== undefined) {
        return Number(ent.actualMeasurement).toFixed(2);
      }
      if (ent.type === 'INSERT') {
        const attrStr = (ent.attribs || []).map(a => `${a.tag || ''}:${a.text || ''}`).join(' ');
        return `${ent.name || ''} ${attrStr}`.trim();
      }
      return '';
    }

    /**
     * Multi-token & subsequence fuzzy matcher
     */
    // Hot path: the haystack and the query tokens are prepared once per search
    // instead of being lowercased/split for every one of 10k+ records.
    function fuzzyMatchLower(hay, tokens) {
      for (const tok of tokens) {
        if (hay.includes(tok)) continue;
        let hIdx = 0;
        let matchedAll = true;
        for (let c = 0; c < tok.length; c++) {
          hIdx = hay.indexOf(tok[c], hIdx);
          if (hIdx === -1) { matchedAll = false; break; }
          hIdx++;
        }
        if (!matchedAll) return false;
      }
      return true;
    }

    function fuzzyMatch(haystack, query) {
      if (!query) return true;
      return fuzzyMatchLower(String(haystack || '').toLowerCase(),
        query.toLowerCase().split(/\s+/).filter(Boolean));
    }

    // Typing rebuilds the whole result list; debounce so a fast typist on a
    // 100k-entity drawing does not re-scan the drawing on every key.
    let searchRebuildTimer = 0;
    function scheduleSearchRebuild(delay = 150) {
      clearTimeout(searchRebuildTimer);
      searchRebuildTimer = setTimeout(() => {
        searchRebuildTimer = 0;
        rebuildSearchMatches();
      }, delay);
    }

    // Enter / next / previous must not act on results from the previous query.
    function flushSearchRebuild() {
      if (!searchRebuildTimer) return;
      clearTimeout(searchRebuildTimer);
      searchRebuildTimer = 0;
      rebuildSearchMatches();
    }

    function rebuildSearchMatches() {
      if (!appState.parsedResult) {
        appState.searchMatches = [];
        appState.activeSearchMatchIdx = -1;
        renderSearchResultsUI();
        return;
      }

      const q = (appState.entitySearchQuery || '').trim();
      const cat = appState.entitySearchCategory || 'all';
      const tokens = q ? q.toLowerCase().split(/\s+/).filter(Boolean) : [];
      const matches = [];
      const seenKeys = new Set();

      // 1. Search rendered text records (`textRecords`)
      const textRecs = appState.parsedResult.textRecords || [];
      if (cat === 'all' || cat === 'text' || cat === 'dim') {
        for (let i = 0; i < textRecs.length; i++) {
          const tr = textRecs[i];
          if (cat === 'text' && tr.type === 'DIMENSION') continue;
          if (cat === 'dim' && tr.type !== 'DIMENSION' && tr.type !== 'LEADER' && tr.type !== 'MLEADER' && tr.type !== 'TOLERANCE') continue;

          if (!tr._searchHay) {
            tr._searchHay = `${tr.plainText} ${tr.type} ${tr.displayLayer || tr.layer} ${tr.parentBlock || ''} #${tr.handle || ''}`.toLowerCase();
          }
          if (tokens.length === 0 || fuzzyMatchLower(tr._searchHay, tokens)) {
            const key = `T_${tr.id}`;
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              matches.push({
                badge: tr.type || 'TEXT',
                label: tr.plainText,
                subLabel: `${tr.displayLayer || tr.layer}${tr.parentBlock ? ' · 块:' + tr.parentBlock : ''}`,
                box: tr.box,
                pickRecord: tr.pickRecord || findPickRecordForEntity(tr.entity, tr.box, tr)
              });
              if (matches.length >= 200) break;
            }
          }
        }
      }

      // 2. Search entities by attributes, properties, block names, layer names, types, handles
      if (matches.length < 200 && (cat === 'all' || cat === 'prop' || cat === 'dim')) {
        const pickRecs = appState.parsedResult.pickRecords || [];
        for (let i = 0; i < pickRecs.length; i++) {
          const pr = pickRecs[i];
          if (pr.isNestedText) continue;
          const ent = pr.entity;
          if (!ent) continue;

          if (cat === 'dim' && ent.type !== 'DIMENSION' && ent.type !== 'LEADER' && ent.type !== 'MLEADER') continue;
          if (cat === 'prop' && (ent.type === 'TEXT' || ent.type === 'MTEXT')) continue;

          if (!pr._searchHay) {
            const plain = extractEntityPlainText(ent);
            const attrPairs = (ent.attribs || []).map(a => `${a.tag}=${a.text}`).join(' ');
            const handleStr = ent.handle ? `#${ent.handle}` : '';
            pr._searchHay = `${ent.type} ${plain} ${ent.name || ''} ${attrPairs} ${pr.displayLayer} ${ent.linetype || ''} ${ent.patternName || ''} ${handleStr}`.toLowerCase();
            pr._searchPlain = plain;
          }

          if (tokens.length === 0 || fuzzyMatchLower(pr._searchHay, tokens)) {
            const plain = pr._searchPlain || '';
            const attrPairs = (ent.attribs || []).map(a => `${a.tag}=${a.text}`).join(' ');
            const handleStr = ent.handle ? `#${ent.handle}` : '';
            const label = plain || (ent.name ? `${ent.name} (${attrPairs || '块参照'})` : `${ent.type} ${handleStr}`);
            const key = `E_${pr.id}`;
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              matches.push({
                badge: ent.type,
                label,
                subLabel: `${pr.displayLayer} ${handleStr}`,
                box: pr.box,
                pickRecord: pr
              });
              if (matches.length >= 200) break;
            }
          }
        }
      }

      appState.searchMatches = matches;
      appState.searchTruncated = matches.length >= 200;
      appState.activeSearchMatchIdx = matches.length > 0 ? 0 : -1;
      renderSearchResultsUI();
    }

    function findPickRecordForEntity(ent, fallbackBox, tr) {
      const res = appState.parsedResult;
      if (res && res.pickRecords && ent) {
        // O(1) reverse lookup instead of a linear .find() per text record.
        if (!res._entityPickMap) {
          const map = new Map();
          for (const r of res.pickRecords) {
            if (r && r.entity && !map.has(r.entity)) map.set(r.entity, r);
          }
          res._entityPickMap = map;
        }
        const found = res._entityPickMap.get(ent);
        if (found) return found;
      }
      return {
        id: -1,
        isTopLevel: false,
        isNestedText: true,
        parentBlock: tr ? tr.parentBlock : null,
        plainText: tr ? tr.plainText : '',
        resolvedFont: tr ? tr.resolvedFont : null,
        entity: ent || { type: (tr && tr.type) || 'TEXT', text: (tr && tr.plainText) || '', layer: (tr && tr.layer) || '0' },
        layer: (tr && tr.layer) || '0',
        displayLayer: (tr && tr.displayLayer) || '0',
        colorPair: (tr && tr.colorPair) || { light: 0x0F172A, dark: 0xF8FAFC },
        box: fallbackBox
      };
    }

    function activateSearchMatch(index) {
      if (!appState.searchMatches || appState.searchMatches.length === 0) return;
      const len = appState.searchMatches.length;
      const idx = ((index % len) + len) % len;
      appState.activeSearchMatchIdx = idx;
      const item = appState.searchMatches[idx];
      renderSearchResultsUI();

      if (item && item.pickRecord) {
        if (appState.parsedResult && item.pickRecord.layer) {
          const lg = appState.parsedResult.layers[item.pickRecord.layer];
          if (lg && !lg.visible) {
            lg.visible = true;
            const stLayer = appState.parsedResult.stats.layers.find(l => l.name === item.pickRecord.layer);
            if (stLayer) stLayer.visible = true;
            updateLayerManagerUI(appState.parsedResult);
          }
        }
        const targetRec = Object.assign({}, item.pickRecord, { box: item.box || item.pickRecord.box });
        appState.multiSelectBackup = null;
        setSelectedRecords([targetRec]);
        zoomToBox(targetRec.box);
      }
    }

    function renderSearchResultsUI() {
      const listEl = document.getElementById('searchResultsList');
      const countEl = document.getElementById('searchMatchCount');
      const clearBtn = document.getElementById('btnClearEntitySearch');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !appState.entitySearchQuery);
      }
      if (!listEl) return;

      const total = appState.searchMatches.length;
      const cur = appState.activeSearchMatchIdx >= 0 ? (appState.activeSearchMatchIdx + 1) : 0;
      if (countEl) countEl.textContent = `${cur} / ${total}`;

      listEl.innerHTML = '';
      if (total === 0) {
        listEl.innerHTML = `<div class="text-[11px] text-slate-500 py-4 text-center">${escapeHtml(t('noSearchMatch'))}</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      appState.searchMatches.forEach((m, idx) => {
        const isActive = idx === appState.activeSearchMatchIdx;
        const row = document.createElement('div');
        row.className = isActive
          ? 'flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-blue-50 border border-blue-200 text-xs transition'
          : 'flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 text-xs transition';
        if (isActive) row.setAttribute('data-active-search', '1');

        row.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 mono text-[10px] font-medium shrink-0">${escapeHtml(m.badge)}</span>
              <span class="font-medium text-slate-800 truncate">${escapeHtml(m.label)}</span>
            </div>
            <div class="text-[10px] text-slate-500 mono truncate mt-0.5">${escapeHtml(m.subLabel)}</div>
          </div>
          <span class="text-[11px] text-blue-600 font-medium shrink-0">${escapeHtml(t('locateShort'))}</span>
        `;
        row.addEventListener('click', () => activateSearchMatch(idx));
        frag.appendChild(row);
      });
      listEl.appendChild(frag);

      // Keep the active row visible when navigating with the ↑/↓ buttons.
      const activeRow = listEl.querySelector('[data-active-search="1"]');
      if (activeRow) {
        const lr = listEl.getBoundingClientRect();
        const ar = activeRow.getBoundingClientRect();
        if (ar.top < lr.top) listEl.scrollTop -= (lr.top - ar.top);
        else if (ar.bottom > lr.bottom) listEl.scrollTop += (ar.bottom - lr.bottom);
      }

      // Be explicit about the cap instead of silently ending at 200.
      if (appState.searchTruncated) {
        const note = document.createElement('div');
        note.className = 'px-2.5 py-1.5 text-[11px] text-slate-500 text-center';
        note.textContent = appState.lang === 'zh' ? '仅显示前 200 条匹配' : 'Showing the first 200 matches';
        listEl.appendChild(note);
      }
    }

    // =========================================================================
    // Selected Object Property Panel ONLY ("属性面板只显示选择对象的属性，不要其他多余的")
    // =========================================================================
    function buildPropSectionHTML(title, rowsHtml) {
      return `
        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-2xs">
          <div class="px-3 py-1.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-700">
            ${escapeHtml(title)}
          </div>
          <div class="divide-y divide-slate-100">
            ${rowsHtml}
          </div>
        </div>
      `;
    }

    function buildPropRowHTML(label, valHtml, isMono = true) {
      return `
        <div class="px-3 py-1.5 flex items-start justify-between gap-2 text-[11px]">
          <span class="text-slate-500 shrink-0">${escapeHtml(label)}</span>
          <span class="${isMono ? 'mono' : ''} text-slate-800 font-medium text-right break-all">${valHtml}</span>
        </div>
      `;
    }

    function fmtVec3(x, y, z, shift = { x: 0, y: 0, z: 0 }) {
      const wx = (Number(x || 0) + (shift.x || 0)).toFixed(2);
      const wy = (Number(y || 0) + (shift.y || 0)).toFixed(2);
      const wz = (Number(z || 0) + (shift.z || 0)).toFixed(2);
      return `(${wx}, ${wy}, ${wz})`;
    }

    function renderPropertyPanel() {
      const headerEl = document.getElementById('lblPropPanelHeader');
      const btnZoom = document.getElementById('btnZoomSelected');
      const btnClear = document.getElementById('btnClearSelection');
      const bodyEl = document.getElementById('propertyPanelBody');
      if (!bodyEl || !appState.parsedResult) return;

      const res = appState.parsedResult;
      const dxf = res.dxf;
      const shift = res.originShift || { x: 0, y: 0, z: 0 };
      const sel = appState.selectedRecords || [];

      if (sel.length === 0) {
        if (headerEl) headerEl.textContent = t('propHeaderEmpty');
        if (btnZoom) btnZoom.classList.add('hidden');
        if (btnClear) btnClear.classList.add('hidden');
        const emptyLines = String(t('propEmptyHint')).split('\n');
        const emptyTitle = emptyLines.shift() || '';
        const emptyHint = emptyLines.join(' ');
        bodyEl.innerHTML = `
          <div class="prop-empty">
            <span class="prop-empty-icon" aria-hidden="true">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3l9 18-4.6-6.6L6 18 9 3z"/>
              </svg>
            </span>
            <div class="prop-empty-title">${escapeHtml(emptyTitle)}</div>
            <div class="prop-empty-hint">${escapeHtml(emptyHint)}</div>
          </div>
        `;
        return;
      }

      if (btnZoom) btnZoom.classList.remove('hidden');
      if (btnClear) btnClear.classList.remove('hidden');

      if (sel.length > 1) {
        if (headerEl) headerEl.textContent = t('multiPropsTitle', sel.length);

        const byTypeCount = {};
        const layerSet = new Set();
        const unionBox = new THREE.Box3();
        sel.forEach(r => {
          const tp = (r.entity && r.entity.type) || 'ENTITY';
          byTypeCount[tp] = (byTypeCount[tp] || 0) + 1;
          layerSet.add(r.displayLayer || r.layer || '0');
          if (r.box && !r.box.isEmpty()) unionBox.union(r.box);
        });

        const filteredSel = appState.multiTypeFilter === 'ALL'
          ? sel
          : sel.filter(r => ((r.entity && r.entity.type) || 'ENTITY') === appState.multiTypeFilter);

        const uSize = new THREE.Vector3();
        if (!unionBox.isEmpty()) unionBox.getSize(uSize);

        const curFilterLabel = appState.multiTypeFilter === 'ALL'
          ? `${appState.lang === 'zh' ? '全部类型' : 'All Types'} (${sel.length})`
          : `${appState.multiTypeFilter} (${byTypeCount[appState.multiTypeFilter] || 0})`;

        const filterMenuRows = [
          { val: 'ALL', label: `${appState.lang === 'zh' ? '全部类型' : 'All Types'} (${sel.length})` },
          ...Object.entries(byTypeCount).map(([tp, c]) => ({ val: tp, label: `${tp} (${c})` }))
        ].map(item => {
          const active = appState.multiTypeFilter === item.val;
          return `
            <button type="button" data-multi-type="${escapeHtml(item.val)}" class="w-full px-2.5 py-1.5 rounded-xl text-left text-xs font-medium ${active ? 'bg-blue-50 text-blue-600' : 'text-slate-700 hover:bg-slate-100'} transition flex items-center justify-between">
              <span>${escapeHtml(item.label)}</span>
              <span class="${active ? '' : 'hidden'} text-[11px] text-blue-600">✓</span>
            </button>
          `;
        }).join('');

        const filterBarHtml = `
          <div class="relative" id="multiTypeDropdownWrapper">
            <button type="button" id="btnMultiTypeDropdown" class="w-full px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/70 text-xs font-medium text-slate-800 transition flex items-center justify-between">
              <span>${escapeHtml(curFilterLabel)}</span>
              <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <div id="multiTypeDropdownMenu" class="hidden absolute left-0 right-0 mt-1 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-xl p-1 z-40 space-y-0.5 max-h-48 overflow-y-auto">
              ${filterMenuRows}
            </div>
          </div>
        `;

        const secSummary = buildPropSectionHTML(t('secMultiSummary'), [
          buildPropRowHTML(appState.lang === 'zh' ? '选中数量' : 'Selected', `${filteredSel.length} / ${sel.length}`),
          buildPropRowHTML(appState.lang === 'zh' ? '图层' : 'Layers', escapeHtml(Array.from(layerSet).slice(0, 4).join(', '))),
          buildPropRowHTML(appState.lang === 'zh' ? '尺寸 (W×H×D)' : 'Span (W×H×D)', `${uSize.x.toFixed(2)} × ${uSize.y.toFixed(2)} × ${uSize.z.toFixed(2)}`)
        ].join(''));

        const itemRows = filteredSel.slice(0, 100).map((r, idx) => {
          const ent = r.entity || {};
          const txt = extractEntityPlainText(ent);
          return `
            <button type="button" data-inspect-idx="${idx}" class="w-full px-3 py-1.5 flex items-center justify-between hover:bg-blue-50/80 transition text-left">
              <div class="min-w-0 pr-2 flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 mono text-[10px] font-semibold shrink-0">${escapeHtml(ent.type || 'ENT')}</span>
                <span class="text-[11px] text-slate-700 truncate">${escapeHtml(txt || ent.name || ('#' + (ent.handle || '')) || r.displayLayer)}</span>
              </div>
              <span class="text-[11px] text-blue-600 shrink-0">${escapeHtml(t('locateShort'))}</span>
            </button>
          `;
        }).join('')
          + (filteredSel.length > 100
            ? `<div class="px-3 py-1.5 text-[11px] text-slate-500">${appState.lang === 'zh'
              ? `仅显示前 100 / 共 ${filteredSel.length} 条`
              : `Showing the first 100 of ${filteredSel.length}`}</div>`
            : '');

        const secList = buildPropSectionHTML(t('secMultiList'), itemRows);
        bodyEl.innerHTML = filterBarHtml + secSummary + secList;

        const btnMultiType = document.getElementById('btnMultiTypeDropdown');
        const menuMultiType = document.getElementById('multiTypeDropdownMenu');
        if (btnMultiType && menuMultiType) {
          btnMultiType.addEventListener('click', (ev) => {
            ev.stopPropagation();
            menuMultiType.classList.toggle('hidden');
          });
          menuMultiType.querySelectorAll('[data-multi-type]').forEach(b => {
            b.addEventListener('click', (ev) => {
              ev.stopPropagation();
              appState.multiTypeFilter = b.getAttribute('data-multi-type');
              menuMultiType.classList.add('hidden');
              renderPropertyPanel();
            });
          });
        }

        bodyEl.querySelectorAll('[data-inspect-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const ix = parseInt(btn.getAttribute('data-inspect-idx'), 10);
            const target = filteredSel[ix];
            if (target) {
              appState.multiSelectBackup = sel.slice();
              setSelectedRecords([target]);
              zoomToBox(target.box);
            }
          });
        });
        return;
      }

      // Single Selected Object Properties
      const rec = sel[0];
      const ent = rec.entity || {};
      if (headerEl) headerEl.textContent = t('entPropsTitle', ent.type || 'ENTITY');

      const backBannerHtml = (appState.multiSelectBackup && appState.multiSelectBackup.length > 1)
        ? `<button id="btnBackToMultiSelection" type="button" class="w-full py-1.5 px-2.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-medium text-left transition">${escapeHtml(t('backToMultiBtn'))} (${appState.multiSelectBackup.length})</button>`
        : '';

      const layerKey = rec.layer || (ent.layer ? String(ent.layer).toUpperCase() : '0');
      const layerObj = (dxf.tables && dxf.tables.layers && dxf.tables.layers[layerKey]) || {};
      const isLight = appState.bgTheme === 'light';
      const colPair = rec.colorPair || { light: 0x0F172A, dark: 0xF8FAFC };
      const activeHex = '#' + new THREE.Color(isLight ? colPair.light : colPair.dark).getHexString().toUpperCase();
      const colorLabel = (ent.trueColor !== null && ent.trueColor !== undefined)
        ? `#${(ent.trueColor & 0xFFFFFF).toString(16).padStart(6, '0').toUpperCase()}`
        : ((ent.colorIndex === undefined || ent.colorIndex === 256) ? `BYLAYER (ACI ${layerObj.colorIndex || 7})` : `ACI ${ent.colorIndex}`);

      const resolvedLtype = (!ent.linetype || ent.linetype.toUpperCase() === 'BYLAYER')
        ? `${layerObj.linetype || 'CONTINUOUS'}`
        : ent.linetype;

      const generalRows = [
        buildPropRowHTML(appState.lang === 'zh' ? '类型' : 'Type', escapeHtml(ent.type || 'ENTITY')),
        buildPropRowHTML(appState.lang === 'zh' ? '句柄' : 'Handle', ent.handle ? `#${escapeHtml(ent.handle)}` : '-'),
        buildPropRowHTML(appState.lang === 'zh' ? '图层' : 'Layer', escapeHtml(rec.displayLayer || ent.layer || '0')),
        buildPropRowHTML(
          appState.lang === 'zh' ? '颜色' : 'Color',
          `<span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block border border-slate-300" style="background:${activeHex}"></span>${escapeHtml(colorLabel)}</span>`
        ),
        buildPropRowHTML(appState.lang === 'zh' ? '线型' : 'Linetype', escapeHtml(resolvedLtype))
      ];
      if (Math.abs(ent.thickness || 0) > 1e-4) {
        generalRows.push(buildPropRowHTML(appState.lang === 'zh' ? '厚度' : 'Thickness', Number(ent.thickness).toFixed(2)));
      }
      if (rec.parentBlock) {
        generalRows.push(buildPropRowHTML(appState.lang === 'zh' ? '所属块' : 'Parent Block', escapeHtml(rec.parentBlock)));
      }
      const secGen = buildPropSectionHTML(t('secGeneral'), generalRows.join(''));

      const specRows = [];
      const tp = ent.type;

      if (tp === 'LINE') {
        const dx = (ent.x1 || 0) - (ent.x || 0);
        const dy = (ent.y1 || 0) - (ent.y || 0);
        const dz = (ent.z1 || 0) - (ent.z || 0);
        const len = Math.hypot(dx, dy, dz);
        let ang = (Math.atan2(dy, dx) * 180) / Math.PI;
        if (ang < 0) ang += 360;
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '起点' : 'Start', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '终点' : 'End', fmtVec3(ent.x1, ent.y1, ent.z1, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '长度' : 'Length', len.toFixed(3)),
          buildPropRowHTML(appState.lang === 'zh' ? '角度' : 'Angle', `${ang.toFixed(2)}°`)
        );
      } else if (tp === 'CIRCLE' || tp === 'ARC') {
        const r = Number(ent.r || 0);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '圆心' : 'Center', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '半径' : 'Radius', r.toFixed(3)),
          buildPropRowHTML(appState.lang === 'zh' ? '直径' : 'Diameter', `⌀${(r * 2).toFixed(3)}`)
        );
        if (tp === 'ARC') {
          specRows.push(
            buildPropRowHTML(appState.lang === 'zh' ? '起始角' : 'Start Angle', `${Number(ent.startAngle || 0).toFixed(2)}°`),
            buildPropRowHTML(appState.lang === 'zh' ? '终止角' : 'End Angle', `${Number(ent.endAngle || 360).toFixed(2)}°`)
          );
        }
      } else if (tp === 'ELLIPSE') {
        const majorR = Math.hypot(ent.x1 || 0, ent.y1 || 0, ent.z1 || 0);
        const ratio = Number(ent.ratio || 1);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '中心' : 'Center', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '长半轴 / 短半轴' : 'Maj / Min R', `${majorR.toFixed(2)} / ${(majorR * ratio).toFixed(2)}`)
        );
      } else if (tp === 'LWPOLYLINE' || tp === 'POLYLINE') {
        const verts = ent.vertices || [];
        const isClosed = (ent.flags & 1) !== 0;
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '顶点数' : 'Vertices', String(verts.length)),
          buildPropRowHTML(appState.lang === 'zh' ? '闭合' : 'Closed', isClosed ? 'Yes' : 'No')
        );
        if (ent.constantWidth) {
          specRows.push(buildPropRowHTML(appState.lang === 'zh' ? '全局宽度' : 'Width', Number(ent.constantWidth).toFixed(2)));
        }
      } else if (tp === 'TEXT' || tp === 'MTEXT' || tp === 'ATTRIB' || tp === 'ATTDEF') {
        const plain = rec.plainText || extractEntityPlainText(ent);
        const stName = (ent.textStyle || 'STANDARD').toUpperCase();
        const stDef = (dxf.tables && dxf.tables.styles && dxf.tables.styles[stName]) || {};
        const h = ent.height || stDef.height || (dxf.header && dxf.header['$TEXTSIZE']) || 2.5;
        specRows.push(
          `<div class="px-3 py-2 bg-slate-50/70">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-medium text-slate-500">${appState.lang === 'zh' ? '内容' : 'Text'}</span>
              <button type="button" id="btnCopyEntityText" class="text-[10px] text-blue-600 hover:underline">${escapeHtml(t('copyTextBtn'))}</button>
            </div>
            <div class="text-xs font-medium text-slate-900 break-words">${escapeHtml(plain)}</div>
          </div>`,
          buildPropRowHTML(appState.lang === 'zh' ? '样式' : 'Style', escapeHtml(stName)),
          buildPropRowHTML(appState.lang === 'zh' ? '字高' : 'Height', Number(h).toFixed(2)),
          buildPropRowHTML(appState.lang === 'zh' ? '旋转角' : 'Rotation', `${Number(ent.rotation || 0).toFixed(1)}°`),
          buildPropRowHTML(appState.lang === 'zh' ? '坐标' : 'Position', fmtVec3(ent.x, ent.y, ent.z, shift))
        );
      } else if (tp === 'DIMENSION' || tp === 'LEADER' || tp === 'MLEADER') {
        const plain = rec.plainText || extractEntityPlainText(ent);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '标注内容' : 'Value', escapeHtml(plain || '-')),
          buildPropRowHTML(appState.lang === 'zh' ? '标注样式' : 'DimStyle', escapeHtml(ent.styleName || ent.dimstyle || 'STANDARD'))
        );
      } else if (tp === 'INSERT') {
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '块名' : 'Block Name', escapeHtml(ent.name || '-')),
          buildPropRowHTML(appState.lang === 'zh' ? '插入点' : 'Position', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '缩放' : 'Scale', `(${Number(ent.xscale ?? 1).toFixed(2)}, ${Number(ent.yscale ?? 1).toFixed(2)}, ${Number(ent.zscale ?? 1).toFixed(2)})`),
          buildPropRowHTML(appState.lang === 'zh' ? '旋转角' : 'Rotation', `${Number(ent.rotation || 0).toFixed(1)}°`)
        );
      } else if (tp === 'HATCH') {
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '图案' : 'Pattern', escapeHtml(ent.patternName || 'SOLID')),
          buildPropRowHTML(appState.lang === 'zh' ? '边界环数' : 'Loops', String((ent.loops || []).length))
        );
      }

      const b = rec.box || new THREE.Box3();
      const bSize = new THREE.Vector3();
      if (!b.isEmpty()) b.getSize(bSize);
      const secBounds = buildPropSectionHTML(t('secGeometryBounds'), [
        buildPropRowHTML('Min', fmtVec3(b.min.x, b.min.y, b.min.z, shift)),
        buildPropRowHTML('Max', fmtVec3(b.max.x, b.max.y, b.max.z, shift)),
        buildPropRowHTML(appState.lang === 'zh' ? '尺寸' : 'Size', `${bSize.x.toFixed(2)} × ${bSize.y.toFixed(2)} × ${bSize.z.toFixed(2)}`)
      ].join(''));

      const secSpec = specRows.length > 0 ? buildPropSectionHTML(t('secSpecifics'), specRows.join('')) : '';

      // Block attributes (ATTRIB) get their own section so they are easy to
      // read instead of being mixed into the generic entity rows.
      let secAttrib = '';
      const attribs = (ent.attribs || []).filter(a => a && (a.tag || a.text));
      if (attribs.length > 0) {
        const rows = attribs.map(attr => {
          const raw = attr.text !== undefined && attr.text !== null ? String(attr.text) : '';
          const shown = raw.trim() ? escapeHtml(raw) : `<span class="text-slate-300">${appState.lang === 'zh' ? '（空）' : '(empty)'}</span>`;
          return buildPropRowHTML(escapeHtml(attr.tag || 'ATTRIB'), shown);
        }).join('');
        secAttrib = buildPropSectionHTML(appState.lang === 'zh' ? '块属性' : 'Block Attributes', rows);
      }

      bodyEl.innerHTML = backBannerHtml + secGen + secSpec + secAttrib + secBounds;

      const btnBack = document.getElementById('btnBackToMultiSelection');
      if (btnBack) {
        btnBack.addEventListener('click', () => {
          if (appState.multiSelectBackup) {

            setSelectedRecords(restore);
          }
        });

      const btnCopyTxt = document.getElementById('btnCopyEntityText');
      if (btnCopyTxt) {

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(plain).then(() => showToast(t('copiedToast')));
          }
        });
      }
    }

        if (child.geometry) child.geometry.dispose();

          child.material.dispose();

      if (bgTheme !== 'light' && bgTheme !== 'dark' && bgTheme !== 'bw') bgTheme = 'dark';
      appState.bgTheme = bgTheme;
      try { localStorage.setItem('dxfviewer.bgTheme', bgTheme); } catch (_) {}

      const isLight = bgTheme === 'light';
      scene.background = new THREE.Color(isLight ? 0xFFFFFF : 0x000000);
      if (dxfRootGroup) {

    async function parseAndRenderCurrentDXFAsync(fitCamera = true) {
      if (!scene) return;
      const jobId = ++appState.parseJobId;

      // The built-in samples are fetched on demand; resolve the initial one.
      if (appState.currentInput == null && appState.currentPresetKey && PRESETS[appState.currentPresetKey]) {
        try {
          updateLoadingProgressUI(true, 1, appState.lang === 'zh' ? '加载示例图纸...' : 'Loading sample...', '');
          appState.currentInput = await loadPresetDxf(appState.currentPresetKey, appState.lang);
        } catch (err) {
          updateLoadingProgressUI(false);
          showToast(appState.lang === 'zh' ? '示例加载失败，请打开本地 DXF' : 'Sample failed to load; open a local DXF');
          return;
        }
      }

      updateLoadingProgressUI(true, 2, appState.lang === 'zh' ? '准备解析图纸...' : 'Preparing parser...', '');

      const isLight = appState.bgTheme === 'light';
      const loader = new window.DXFLoader();
      loader.setOptions({
        backgroundColor: isLight ? 'light' : 'dark',
        defaultColor: isLight ? 0x0F172A : 0xF8FAFC,
        centerOrigin: true
      });

      try {
        const result = await loader.parseAsync(appState.currentInput, null, (prog) => {
          if (jobId !== appState.parseJobId) return;
          updateLoadingProgressUI(true, prog.percent, prog.stage, prog.detail);
        });

        if (jobId !== appState.parseJobId) return;

        // Garbage input often parses into an empty scene instead of throwing;
        // keep the previous drawing and surface the problem instead of silently
        // replacing it with a blank canvas.
        if (!result || !result.stats || result.stats.totalEntities === 0) {
          appState.lastParseFailed = true;
          if (jobId === appState.parseJobId) {
            showToast(appState.lang === 'zh'
              ? '未在该文件中找到可显示的图元'
              : 'No drawable entities were found in this file');
          }
          return;
        }

        if (dxfRootGroup) {
          scene.remove(dxfRootGroup);
          disposeSceneGroup(dxfRootGroup);
          dxfRootGroup = null;
        }
        disposeSelectionOutlines();

        appState.parsedResult = result;
        appState.lastParseFailed = false;
        appState.selectedRecords = [];
        appState.multiSelectBackup = null;
        dxfRootGroup = result.scene;
        scene.add(dxfRootGroup);

        applyThemeInstant(appState.bgTheme);
        updateLayerManagerUI(result);
        updateStatusBar(result);
        rebuildSearchMatches();
        setSelectedRecords([]);

        if (fitCamera) {
          const bbox = result.boundingBox;
          const sz = new THREE.Vector3();
          bbox.getSize(sz);
          const isPrimarily3D = appState.currentPresetKey.endsWith('_3d') ||
            (result.stats.has3D && sz.z > Math.max(sz.x, sz.y) * 0.18);
          fitViewToScene(isPrimarily3D ? 'iso' : 'top');
        }

        if (renderer && scene && activeCamera) {
          requestRender();
        }
      } catch (err) {
        // Keep the previous drawing on screen and tell the user what happened;
        // an unhandled rejection used to close the overlay silently.
        console.error('[dxfviewer] DXF parse failed:', err);
        if (jobId === appState.parseJobId) {
          appState.lastParseFailed = true;
          showToast(appState.lang === 'zh'
            ? '图纸解析失败，请检查 DXF 文件是否完整'
            : 'Failed to parse this DXF file');
        }
      } finally {
        if (jobId === appState.parseJobId) {
          updateLoadingProgressUI(false);
        }
      }
    }

    function fitViewToScene(mode = 'top') {
      if (!appState.parsedResult) return;
      updateViewButtonsUI(mode);

      const bbox = appState.parsedResult.boundingBox;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      if (bbox.isEmpty()) {
        center.set(0, 0, 0);
        size.set(100, 100, 20);
      } else {
        bbox.getCenter(center);
        bbox.getSize(size);
      }

      const maxDim = Math.max(size.x, size.y, size.z, 10);
      const container = document.getElementById('threeCanvasContainer');
      const aspect = (container.clientWidth || 800) / Math.max(1, container.clientHeight || 600);

      // Fit both axes: on a phone the canvas is tall and narrow, so fitting the
      // height alone would push a wide drawing off-screen horizontally.
      const fitH = Math.max(size.y, size.x / Math.max(aspect, 1e-6), 10);
      const frustumH = Math.max(maxDim, fitH) * 1.22;
      orthoCamera.left = (-frustumH * aspect) / 2;
      orthoCamera.right = (frustumH * aspect) / 2;
      orthoCamera.top = frustumH / 2;
      orthoCamera.bottom = -frustumH / 2;
      orthoCamera.near = -Math.max(2000, maxDim * 8);
      orthoCamera.far = Math.max(2000, maxDim * 8);
      orthoCamera.zoom = 1;
      orthoCamera.updateProjectionMatrix();

      perspCamera.near = Math.max(0.1, maxDim * 0.0005);
      perspCamera.far = Math.max(10000, maxDim * 20);
      perspCamera.updateProjectionMatrix();

      const dist = maxDim * 1.6;
      if (mode === 'top') {
        activeCamera.up.set(0, 1, 0);
        activeCamera.position.set(center.x, center.y, center.z + dist);
      } else {
        activeCamera.up.set(0, 0, 1);
        activeCamera.position.set(center.x + dist * 0.78, center.y - dist * 0.88, center.z + dist * 0.68);
      }

      createCleanOrbitControls(activeCamera, renderer.domElement, center);
      requestRender();
    }

      return result.stats.layers.filter(l =>
        (l.displayName || l.name || '').toLowerCase().includes(q) ||
        (l.name || '').toLowerCase().includes(q)

    }

    function updateStatusBar(result) {

          ? `${result.stats.totalEntities} 图元 · ${result.stats.layers.length} 图层 · ${result.stats.parseTimeMs}ms`

    function loadUploadedFile(file) {
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      updateLoadingProgressUI(true, 1, appState.lang === 'zh' ? '正在读取本地文件...' : 'Reading file...', `${file.name} (${sizeMB} MB)`);
      const reader = new FileReader();
      reader.onprogress = (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / Math.max(1, ev.total)) * 8);
          updateLoadingProgressUI(true, pct, appState.lang === 'zh' ? '正在读取本地文件...' : 'Reading file...', `${Math.round((ev.loaded / ev.total) * 100)}%`);
        }
      };
      reader.onerror = () => {
        updateLoadingProgressUI(false);
        showToast(appState.lang === 'zh' ? '读取本地文件失败' : 'Could not read the local file');
      };
      reader.onload = async (ev) => {
        const buffer = ev.target.result;
        const prevState = {
          key: appState.currentPresetKey,
          name: appState.currentFileName,
          input: appState.currentInput
        };
        let decoded;
        try {
          decoded = window.DXFLoader.decodeDXFArrayBuffer(buffer);
        } catch (err) {
          console.error('[dxfviewer] decode failed:', err);
          updateLoadingProgressUI(false);
          showToast(appState.lang === 'zh' ? '无法识别该文件格式' : 'Unrecognised file format');
          return;
        }
        if (decoded.isBinary) {
          updateLoadingProgressUI(false);
          showToast(appState.lang === 'zh' ? '检测到二进制 DXF，请另存为 ASCII DXF' : 'Binary DXF detected; save as ASCII DXF');
          return;
        }
        appState.currentPresetKey = 'custom';
        clearSampleSelectionUI();
        setFileNameDisplay(file.name);
        appState.currentInput = buffer;
        await parseAndRenderCurrentDXFAsync(true);
        if (appState.lastParseFailed || !appState.parsedResult) {
          // A bad file must not rename the drawing that is still on screen.
          appState.currentPresetKey = prevState.key;
          appState.currentInput = prevState.input;
          setFileNameDisplay(prevState.name);
          markSamplePresetActive(prevState.key === 'custom' ? null : prevState.key);
          return;
        }
        const st = appState.parsedResult.stats;
        showToast(appState.lang === 'zh'
          ? `已加载 ${file.name} (${st.totalEntities} 图元)`
          : `Loaded ${file.name} (${st.totalEntities} entities)`);
      };
      reader.readAsArrayBuffer(file);
    }

    window.addEventListener('DOMContentLoaded', () => {
      captureLayoutRefs();
      applyViewportMode();

      initThreeViewport();
      parseAndRenderCurrentDXFAsync(true);

      // Left Layer Drawer Toggle (portrait opens the 图层 tab of the bottom sheet)
      document.getElementById('btnToggleDrawer').addEventListener('click', () => {
        if (appState.viewportMode === 'portrait') {
          const alreadyOpen = appState.sheetOpen && appState.sheetTab === 'layers';
          setSheetOpen(!alreadyOpen, 'layers');
          return;
        }
        const drawer = document.getElementById('layerDrawer');
        appState.drawerOpen = !appState.drawerOpen;
        try { localStorage.setItem('dxfviewer.drawerOpen', appState.drawerOpen ? '1' : '0'); } catch (_) {}
        drawer.style.display = appState.drawerOpen ? 'flex' : 'none';
        syncDrawerResizers();
        setTimeout(onWindowResize, 20);
      });

      // Right Property Drawer Toggle (portrait opens the 对象属性 tab of the bottom sheet)
      document.getElementById('btnTogglePropDrawer').addEventListener('click', () => {
        if (appState.viewportMode === 'portrait') {
          const alreadyOpen = appState.sheetOpen && appState.sheetTab === 'props';
          setSheetOpen(!alreadyOpen, 'props');
          return;
        }
        const propDrawer = document.getElementById('propertyDrawer');
        appState.propDrawerOpen = !appState.propDrawerOpen;
        try { localStorage.setItem('dxfviewer.propDrawerOpen', appState.propDrawerOpen ? '1' : '0'); } catch (_) {}
        propDrawer.style.display = appState.propDrawerOpen ? 'flex' : 'none';
        syncDrawerResizers();
        setTimeout(onWindowResize, 20);
      });

      // Bottom-sheet tab switch: 图层 | 对象属性
      document.querySelectorAll('[data-sheet-tab]').forEach(tabBtn => {
        tabBtn.addEventListener('click', () => {
          setSheetOpen(true, tabBtn.getAttribute('data-sheet-tab'));
        });
      });

      // Three-mode breakpoint switching: relocate existing DOM, never rebuild the canvas.
      let viewportModeRaf = 0;
      const handleViewportChange = () => {
        if (viewportModeRaf) return;
        viewportModeRaf = requestAnimationFrame(() => {
          viewportModeRaf = 0;
          const active = document.activeElement;
          const typing = !!(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'));
          // A soft keyboard can shrink the viewport below 500px while the user is
          // typing; keep the portrait shell instead of flipping to landscape.
          if (typing && appState.viewportMode === 'portrait') return;
          const changed = applyViewportMode();
          onWindowResize();
          // Phone rotation changes the usable canvas dramatically; re-fit so the
          // drawing is not left half off-screen after the mode switch.
          if (changed && appState.parsedResult) {
            fitViewToScene(appState.viewMode || 'top');
          }
        });
      };
      window.addEventListener('resize', handleViewportChange);
      window.addEventListener('orientationchange', handleViewportChange);
      // Re-evaluate once typing ends, so a rotation performed with the soft
      // keyboard open is not left stuck in the portrait shell.
      document.addEventListener('focusout', handleViewportChange);

      // Standalone Search Panel Open / Close
      const searchPanel = document.getElementById('searchFloatingPanel');
      document.getElementById('btnToggleSearchPanel').addEventListener('click', () => {
        appState.searchPanelOpen = !appState.searchPanelOpen;
        searchPanel.classList.toggle('hidden', !appState.searchPanelOpen);
        document.getElementById('btnToggleSearchPanel').setAttribute('aria-expanded', String(appState.searchPanelOpen));
        if (appState.searchPanelOpen) {
          rebuildSearchMatches();
          document.getElementById('entitySearchInput').focus();
        }
      });
      document.getElementById('btnCloseSearchPanel').addEventListener('click', () => {
        appState.searchPanelOpen = false;
        searchPanel.classList.add('hidden');
        document.getElementById('btnToggleSearchPanel').setAttribute('aria-expanded', 'false');
      });

      // Top-Right Sample Dropdown Toggle & Selection
      const sampleMenu = document.getElementById('sampleDropdownMenu');
      document.getElementById('btnSampleDropdown').addEventListener('click', (e) => {
        e.stopPropagation();
        const open = sampleMenu.classList.toggle('hidden') === false;
        syncMenuExpanded('btnSampleDropdown', open);
      });
      window.addEventListener('click', () => {
        sampleMenu.classList.add('hidden');
        syncMenuExpanded('btnSampleDropdown', false);
      });

      sampleMenu.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = btn.getAttribute('data-preset');
          sampleMenu.classList.add('hidden');
          syncMenuExpanded('btnSampleDropdown', false);
          if (!PRESETS[key]) {
            showToast(appState.lang === 'zh' ? '该示例暂不可用' : 'This sample is not available');
            return;
          }
          const prevState = {
            key: appState.currentPresetKey,
            name: appState.currentFileName,
            input: appState.currentInput
          };
          markSamplePresetActive(key);
          appState.currentPresetKey = key;
          setFileNameDisplay(PRESETS[key].file);
          try {
            appState.currentInput = await loadPresetDxf(key, appState.lang);
          } catch (err) {
            showToast(appState.lang === 'zh' ? '示例加载失败' : 'Failed to load sample');
            return;
          }
          await parseAndRenderCurrentDXFAsync(true);
          if (appState.lastParseFailed) {
            appState.currentPresetKey = prevState.key;
            appState.currentInput = prevState.input;
            setFileNameDisplay(prevState.name);
            markSamplePresetActive(prevState.key === 'custom' ? null : prevState.key);
            return;
          }
          const title = appState.lang === 'zh' ? PRESETS[key].title_zh : PRESETS[key].title_en;
          showToast(title);
        });
      });

      // Language Switcher
      // Language Switcher — the UI starts in English; the visitor's choice is
      // remembered so a repeat visit keeps their language.
      document.getElementById('btnLangToggle').addEventListener('click', () => {
        appState.lang = appState.lang === 'zh' ? 'en' : 'zh';
        try { localStorage.setItem('dxfviewer.lang', appState.lang); } catch (_) {}
        applyLanguageUI();
        reloadCurrentPresetForLanguage();
      });
      // Apply the language (and the sample titles that come with it) on start.
      applyLanguageUI();

      // Mode switcher removed — AutoCAD unified pick/box gestures (setInteractionMode is a no-op)

      // Custom Material Design Theme Dropdown
      const themeMenu = document.getElementById('themeDropdownMenu');
      document.getElementById('btnThemeDropdown').addEventListener('click', (e) => {
        e.stopPropagation();
        sampleMenu.classList.add('hidden');
        syncMenuExpanded('btnSampleDropdown', false);
        const open = themeMenu.classList.toggle('hidden') === false;
        syncMenuExpanded('btnThemeDropdown', open);
      });
      themeMenu.querySelectorAll('[data-theme-val]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          themeMenu.classList.add('hidden');
          syncMenuExpanded('btnThemeDropdown', false);
          applyThemeInstant(btn.getAttribute('data-theme-val'));
        });
      });
      window.addEventListener('click', () => {
        themeMenu.classList.add('hidden');
        syncMenuExpanded('btnThemeDropdown', false);
        const mMenu = document.getElementById('multiTypeDropdownMenu');
        if (mMenu) mMenu.classList.add('hidden');
      });

      // Layer Search Input
      const layerSearchInput = document.getElementById('layerSearchInput');
      layerSearchInput.addEventListener('input', (e) => {
        appState.layerFilterQuery = e.target.value || '';
        if (appState.parsedResult) updateLayerManagerUI(appState.parsedResult);
      });
      document.getElementById('btnClearLayerSearch').addEventListener('click', () => {
        appState.layerFilterQuery = '';
        layerSearchInput.value = '';
        if (appState.parsedResult) updateLayerManagerUI(appState.parsedResult);
      });

      document.getElementById('btnLayersAllOn').addEventListener('click', () => {
        if (!appState.parsedResult) return;
        getFilteredLayers(appState.parsedResult).forEach(l => {
          l.visible = true;
          const lg = appState.parsedResult.layers[l.name];
          if (lg) lg.visible = true;
        });
        updateLayerManagerUI(appState.parsedResult);
        requestRender();
      });

      document.getElementById('btnLayersAllOff').addEventListener('click', () => {
        if (!appState.parsedResult) return;
        getFilteredLayers(appState.parsedResult).forEach(l => {
          l.visible = false;
          const lg = appState.parsedResult.layers[l.name];
          if (lg) lg.visible = false;
        });
        updateLayerManagerUI(appState.parsedResult);
        pruneSelectionToVisibleLayers();
        requestRender();
      });

      // Fuzzy Search Input & Category Tabs
      const entSearchInput = document.getElementById('entitySearchInput');
      entSearchInput.addEventListener('input', (e) => {
        appState.entitySearchQuery = e.target.value || '';
        scheduleSearchRebuild();
      });
      entSearchInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        flushSearchRebuild();
        if (appState.searchMatches.length > 0) {
          const nextIdx = e.shiftKey ? (appState.activeSearchMatchIdx - 1) : (appState.activeSearchMatchIdx + 1);
          activateSearchMatch(nextIdx);
        }
      });
      document.getElementById('btnClearEntitySearch').addEventListener('click', () => {
        appState.entitySearchQuery = '';
        entSearchInput.value = '';
        rebuildSearchMatches();
      });

      document.querySelectorAll('.search-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.entitySearchCategory = btn.getAttribute('data-search-cat');
          document.querySelectorAll('.search-cat-btn').forEach(b => {
            b.classList.toggle('is-active', b === btn);
            b.setAttribute('aria-pressed', String(b === btn));
          });
          rebuildSearchMatches();
        });
      });

      document.getElementById('btnSearchPrev').addEventListener('click', () => {
        flushSearchRebuild();
        activateSearchMatch(appState.activeSearchMatchIdx - 1);
      });
      document.getElementById('btnSearchNext').addEventListener('click', () => {
        flushSearchRebuild();
        activateSearchMatch(appState.activeSearchMatchIdx + 1);
      });

      // Property Panel Actions
      document.getElementById('btnZoomSelected').addEventListener('click', () => zoomToSelectedRecords());
      document.getElementById('btnClearSelection').addEventListener('click', () => clearSelection());

      // ESC unwinds the topmost surface first: menus → search → sheet → selection.
      document.addEventListener('keydown', (e) => {
        const el = document.activeElement;
        const typing = !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable));
        const mod = e.ctrlKey || e.metaKey;

        // Ctrl/Cmd+F opens the entity search; plain F fits; Delete clears.
        if (mod && (e.key === 'f' || e.key === 'F')) {
          e.preventDefault();
          if (!appState.searchPanelOpen) {
            appState.searchPanelOpen = true;
            document.getElementById('searchFloatingPanel').classList.remove('hidden');
            document.getElementById('btnToggleSearchPanel').setAttribute('aria-expanded', 'true');
            rebuildSearchMatches();
          }
          document.getElementById('entitySearchInput').focus();
          return;
        }
        if (!typing && !mod && (e.key === 'f' || e.key === 'F')) {
          e.preventDefault();
          fitViewToScene(appState.viewMode || 'top');
          return;
        }
        if (!typing && (e.key === 'Delete' || e.key === 'Backspace')) {
          if ((appState.selectedRecords || []).length > 0) {
            e.preventDefault();
            clearSelection();
          }
          return;
        }

        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (typing) {
          // In the entity search box ESC closes the panel; in the layer filter
          // it clears the query first, otherwise it just leaves the field.
          if (el.id === 'entitySearchInput') {
            appState.searchPanelOpen = false;
            document.getElementById('searchFloatingPanel').classList.add('hidden');
            const searchBtn = document.getElementById('btnToggleSearchPanel');
            if (searchBtn) searchBtn.setAttribute('aria-expanded', 'false');
            el.blur();
            return;
          }
          if (el.id === 'layerSearchInput' && el.value) {
            el.value = '';
            appState.layerFilterQuery = '';
            if (appState.parsedResult) updateLayerManagerUI(appState.parsedResult);
            return;
          }
          el.blur();
          return;
        }
        const themeMenu = document.getElementById('themeDropdownMenu');
        if (themeMenu && !themeMenu.classList.contains('hidden')) {
          themeMenu.classList.add('hidden');
          syncMenuExpanded('btnThemeDropdown', false);
          return;
        }
        const sampleMenuEl = document.getElementById('sampleDropdownMenu');
        if (sampleMenuEl && !sampleMenuEl.classList.contains('hidden')) {
          sampleMenuEl.classList.add('hidden');
          syncMenuExpanded('btnSampleDropdown', false);
          return;
        }
        const multiMenu = document.getElementById('multiTypeDropdownMenu');
        if (multiMenu && !multiMenu.classList.contains('hidden')) {
          multiMenu.classList.add('hidden');
          return;
        }
        if (appState.searchPanelOpen) {
          appState.searchPanelOpen = false;
          document.getElementById('searchFloatingPanel').classList.add('hidden');
          const searchBtn = document.getElementById('btnToggleSearchPanel');
          if (searchBtn) searchBtn.setAttribute('aria-expanded', 'false');
          return;
        }
        if (appState.viewportMode === 'portrait' && appState.sheetOpen) {
          setSheetOpen(false);
          return;
        }
        if ((appState.selectedRecords || []).length > 0) {
          e.preventDefault();
          clearSelection();
        }
      });

      // Keep the trigger's aria-expanded in sync with the menu it owns.
      function syncMenuExpanded(btnId, open) {
        const btn = document.getElementById(btnId);
        if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      syncMenuExpanded('btnThemeDropdown', false);
      syncMenuExpanded('btnSampleDropdown', false);

      document.getElementById('btnViewTop').addEventListener('click', () => fitViewToScene('top'));
      document.getElementById('btnViewIso').addEventListener('click', () => fitViewToScene('iso'));
      document.getElementById('btnFitView').addEventListener('click', () => fitViewToScene(appState.viewMode || 'top'));

      document.getElementById('dxfFileInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        // Clear so choosing the same file again still fires `change`.
        e.target.value = '';
        if (!file) return;
        if (!/\.(dxf|txt)$/i.test(file.name)) {
          showToast(appState.lang === 'zh' ? '请选择 .dxf 或 .txt 文件' : 'Choose a .dxf or .txt file');
          return;
        }
        loadUploadedFile(file);
      });

      // Export the current viewport as a PNG (toolbar button or Ctrl/Cmd+S).
      const exportViewToPng = () => {
        if (!renderer || !scene || !activeCamera) return;
        try {
          renderer.render(scene, activeCamera);
          const url = renderer.domElement.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = String(appState.currentFileName || 'drawing').replace(/\.(dxf|txt)$/i, '') + '.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast(appState.lang === 'zh' ? '已导出 PNG' : 'PNG exported');
        } catch (err) {
          console.error('[dxfviewer] export failed:', err);
          showToast(appState.lang === 'zh' ? '导出失败' : 'Export failed');
        }
      };
      document.getElementById('btnExportPng').addEventListener('click', exportViewToPng);
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); exportViewToPng(); }
      });

      // Never let a rejected promise disappear without a trace in the console.
      window.addEventListener('unhandledrejection', (ev) => {
        console.error('[dxfviewer] unhandled rejection:', ev.reason);
      });
    });

    function bindPanelResizer(handleId, panelId, { min, max, edge, storageKey }) {
      const handle = document.getElementById(handleId);
      const panel = document.getElementById(panelId);
      if (!handle || !panel) return;
      const saved = parseInt(localStorage.getItem(storageKey) || '', 10);
      if (saved >= min && saved <= max) panel.style.width = saved + 'px';
      let startX = 0, startW = 0, dragging = false;
      const onMove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const w = Math.max(min, Math.min(max, startW + (edge === 'left' ? dx : -dx)));
        panel.style.width = w + 'px';
        if (typeof onWindowResize === 'function') onWindowResize();
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('is-dragging');
        document.body.classList.remove('is-resizing-panel');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        const w = parseInt(panel.style.width, 10);
        if (w) localStorage.setItem(storageKey, String(w));
        if (typeof onWindowResize === 'function') onWindowResize();
      };
      handle.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        dragging = true;
        startX = e.clientX;
        startW = panel.getBoundingClientRect().width;
        handle.classList.add('is-dragging');
        document.body.classList.add('is-resizing-panel');
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    }

    bindPanelResizer('layerDrawerResizer', 'layerDrawer', { min: 160, max: 480, edge: 'left', storageKey: 'cadViewer.layerDrawerWidth' });
    bindPanelResizer('propertyDrawerResizer', 'propertyDrawer', { min: 220, max: 560, edge: 'right', storageKey: 'cadViewer.propertyDrawerWidth' });
  </script>
</body>
</html>
