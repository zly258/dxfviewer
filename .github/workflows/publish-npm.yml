name: Publish to npm

# 触发方式：
# 1) 在 GitHub 上「创建 Release（发布）」时自动发布到 npm —— 版本号取自 package.json，
#    tag 必须与版本号一致（例如 tag v1.6.0 ↔ package.json 1.6.0）。
# 2) 手动触发（Actions → Publish to npm → Run workflow），默认 dry-run，只校验不发布。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建并打包校验，不真正发布'
        type: boolean
        default: true

permissions:
  contents: read
  # npm 可信发布（OIDC）与 --provenance 都需要 id-token: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布 @zhangly1403/dxfviewer
    runs-on: ubuntu-latest
    # 与 npm 包设置里「Trusted Publisher → Environment name」保持一致
    environment: npm
    timeout-minutes: 25
    env:
      # 仓库 Secret 里配置了 NPM_TOKEN 就走令牌方式，否则走 OIDC 可信发布
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 固定 npm 官方源
        run: |
          npm config delete proxy --location=user || true
          npm config delete https-proxy --location=user || true
          npm config set registry https://registry.npmjs.org/
          npm config get registry
          node -v
          npm -v

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org/ --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: 版本一致性校验（tag 与 package.json）
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "package.json = $PKG_VERSION / release tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::版本不一致：请先把 package.json 版本改为 $TAG_VERSION 并重新打 tag"
            exit 1
          fi
          if npm view "@zhangly1403/dxfviewer@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::npm 上已存在 @zhangly1403/dxfviewer@$PKG_VERSION，请先升级版本号"
            exit 1
          fi

      - name: 构建（含类型检查）与 UI 审计
        run: |
          npm run build:lib
          npm run check:ui

      - name: 打包内容预览
        run: npm pack --dry-run

      # ── 方式 A：仓库 Secret 里配置了 NPM_TOKEN（Granular Access Token） ──
      - name: 配置 npm 令牌
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm whoami

      - name: 发布（NPM_TOKEN）
        if: env.HAS_NPM_TOKEN == 'true' && env.DRY_RUN != 'true'
        run: npm publish --access public --provenance

      # ── 方式 B：未配置 NPM_TOKEN 时走 npm 可信发布（OIDC，无需任何密钥） ──
      - name: 发布（OIDC 可信发布）
        if: env.HAS_NPM_TOKEN != 'true' && env.DRY_RUN != 'true'
        run: npm publish --access public --provenance

      - name: 汇总
        run: |
          echo "版本：$(node -p "require('./package.json').version")"
          echo "dry_run：$DRY_RUN"
          echo "发布方式：$([ "$HAS_NPM_TOKEN" = "true" ] && echo 'NPM_TOKEN' || echo 'OIDC 可信发布')"
