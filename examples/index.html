        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m && m.dispose());
          else obj.material.dispose();
        }
      });
      selectionOutlineGroup = null;
      _fatOutlineEdges = null;
      _fatOutlinePixelSize = 0;
    }

    function _edgeKey(ax, ay, az, bx, by, bz) {
      const q = 10000;
      const a = `${Math.round(ax * q)},${Math.round(ay * q)},${Math.round(az * q)}`;
      const b = `${Math.round(bx * q)},${Math.round(by * q)},${Math.round(bz * q)}`;
      return a < b ? a + '|' + b : b + '|' + a;
    }

    /**
     * Build an additive highlight overlay for the selected 3D solids.
     *
     * The batched 3D mesh is one merged mesh per layer, so a per-vertex colour
     * rewrite alone cannot make a selected solid stand out under PBR shading.
     * This extracts the triangles that belong to the selected pick ids and
     * renders them a second time with an additive, depth-tested material so
     * the selection reads clearly from any viewpoint without re-parsing.
     */
    function _buildSelected3DHighlight(selectedIdSet) {
      if (!dxfRootGroup || !selectedIdSet || selectedIdSet.size === 0) return null;
      const positions = [];
      const normals = [];
      const tmp = new THREE.Vector3();
      const mw = new THREE.Matrix4();
      let any = false;

      dxfRootGroup.updateMatrixWorld(true);
      dxfRootGroup.traverse(obj => {
        const pids = obj.userData && obj.userData.pickIds;
        if (!pids || !obj.isMesh || !obj.geometry) return;
        if (!obj.name || !obj.name.startsWith('BatchedMesh3D')) return;
        const pos = obj.geometry.getAttribute('position');
        const nrm = obj.geometry.getAttribute('normal');
        if (!pos) return;
        const vCount = Math.min(pos.count, pids.length);
        const triCount = Math.floor(vCount / 3);
        mw.copy(obj.matrixWorld);

        // Pre-transform into world space so the overlay needs no extra matrix.
        const world = new Float32Array(vCount * 3);
        for (let v = 0; v < vCount; v++) {
          tmp.fromBufferAttribute(pos, v).applyMatrix4(mw);
          world[v * 3] = tmp.x; world[v * 3 + 1] = tmp.y; world[v * 3 + 2] = tmp.z;
        }

        for (let t = 0; t < triCount; t++) {
          const i0 = t * 3;
          if (!selectedIdSet.has(pids[i0])) continue;
          const i1 = i0 + 1, i2 = i0 + 2;
          positions.push(world[i0 * 3], world[i0 * 3 + 1], world[i0 * 3 + 2]);
          positions.push(world[i1 * 3], world[i1 * 3 + 1], world[i1 * 3 + 2]);
          positions.push(world[i2 * 3], world[i2 * 3 + 1], world[i2 * 3 + 2]);
          if (nrm) {
            for (const iv of [i0, i1, i2]) {
              normals.push(nrm.getX(iv), nrm.getY(iv), nrm.getZ(iv));
            }
          }
          any = true;
        }
      });

      if (!any || !positions.length) return null;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      if (normals.length === positions.length) {
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      }
      const isLight = appState.bgTheme === 'light';
      const color = isLight ? 0x8B5CF6 : 0xC4B5FD;
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
        toneMapped: false
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.renderOrder = 999;
      mesh.frustumCulled = false;
      mesh.name = 'Selected3DHighlight';
      return mesh;
    }

    function _collectSelectedEdges(selectedIdSet) {
      const meshEdges = [];
      const lineEdges = [];
      if (!dxfRootGroup || !selectedIdSet || selectedIdSet.size === 0) {
        return { meshEdges, lineEdges };
      }
      const COS_CREASE = Math.cos(38 * Math.PI / 180);
      dxfRootGroup.updateMatrixWorld(true);
      const mw = new THREE.Matrix4();
      const va = new THREE.Vector3();
      const vb = new THREE.Vector3();
      const vc = new THREE.Vector3();
      const e1 = new THREE.Vector3();
      const e2 = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      dxfRootGroup.traverse(obj => {
        const pids = obj.userData && obj.userData.pickIds;
        const geom = obj.geometry;
        if (!pids || !geom) return;
        const pos = geom.getAttribute('position');
        if (!pos) return;
        const vCount = Math.min(pos.count, pids.length);
        mw.copy(obj.matrixWorld);

        if (obj.isMesh) {
          const edgeMap = new Map();
          const triCount = Math.floor(vCount / 3);
          for (let t = 0; t < triCount; t++) {
            const i0 = t * 3;
            const pid = pids[i0];
            if (!selectedIdSet.has(pid)) continue;
            va.fromBufferAttribute(pos, i0).applyMatrix4(mw);
            vb.fromBufferAttribute(pos, i0 + 1).applyMatrix4(mw);
            vc.fromBufferAttribute(pos, i0 + 2).applyMatrix4(mw);
            e1.subVectors(vb, va);
            e2.subVectors(vc, va);
            nrm.crossVectors(e1, e2);
            if (nrm.lengthSq() < 1e-20) continue;
            nrm.normalize();
            const verts = [va, vb, vc];
            for (let k = 0; k < 3; k++) {
              const p = verts[k], q = verts[(k + 1) % 3];
              const key = _edgeKey(p.x, p.y, p.z, q.x, q.y, q.z);
              let rec = edgeMap.get(key);
              if (!rec) {
                rec = {
                  ax: p.x, ay: p.y, az: p.z, bx: q.x, by: q.y, bz: q.z,
                  n1x: nrm.x, n1y: nrm.y, n1z: nrm.z, count: 1
                };
                edgeMap.set(key, rec);
              } else {
                rec.count += 1;
                const dot = rec.n1x * nrm.x + rec.n1y * nrm.y + rec.n1z * nrm.z;
                rec.sharp = rec.sharp || dot < COS_CREASE;
              }
            }
          }
          edgeMap.forEach(rec => {
            if (rec.count === 1 || rec.sharp) meshEdges.push(rec);
          });
        } else if (obj.isLine || obj.isLineSegments) {
          const segCount = Math.floor(vCount / 2);
          for (let s = 0; s < segCount; s++) {
            const i0 = s * 2;
            if (!selectedIdSet.has(pids[i0]) && !selectedIdSet.has(pids[i0 + 1])) continue;
            va.fromBufferAttribute(pos, i0).applyMatrix4(mw);
            vb.fromBufferAttribute(pos, i0 + 1).applyMatrix4(mw);
            lineEdges.push({ ax: va.x, ay: va.y, az: va.z, bx: vb.x, by: vb.y, bz: vb.z });
          }
        }
      });
      return { meshEdges, lineEdges };
    }

    function _makeLineSegments(edges, color, alwaysOnTop) {
      if (!edges.length) return null;
      const arr = new Float32Array(edges.length * 6);
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const o = i * 6;
        arr[o] = e.ax; arr[o + 1] = e.ay; arr[o + 2] = e.az;
        arr[o + 3] = e.bx; arr[o + 4] = e.by; arr[o + 5] = e.bz;
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      const mat = new THREE.LineBasicMaterial({
        color,
        depthTest: !alwaysOnTop,
        depthWrite: false,
        transparent: alwaysOnTop,
        opacity: alwaysOnTop ? 0.35 : 1,
        toneMapped: false
      });
      const lines = new THREE.LineSegments(geom, mat);
      lines.renderOrder = alwaysOnTop ? 1002 : 1000;
      lines.frustumCulled = false;
      return lines;
    }

    function _makeFatRibbonMesh(edges, color, pixelWidth, atPoint) {
      if (!edges.length) return null;
      const wpp = getWorldUnitsPerPixel(atPoint);
      const half = Math.max(wpp * pixelWidth * 0.5, wpp * 0.8);
      const camPos = activeCamera ? activeCamera.position : new THREE.Vector3(0, 0, 1);
      const preferZ = (appState.viewMode === 'top');
      const positions = new Float32Array(edges.length * 6 * 3);
      const dir = new THREE.Vector3();
      const mid = new THREE.Vector3();
      const side = new THREE.Vector3();
      const view = new THREE.Vector3();
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      let nvert = 0;
      const put = (x, y, z) => {
        const o = nvert * 3;
        positions[o] = x; positions[o + 1] = y; positions[o + 2] = z;
        nvert++;
      };
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        a.set(e.ax, e.ay, e.az);
        b.set(e.bx, e.by, e.bz);
        dir.subVectors(b, a);
        if (dir.lengthSq() < 1e-16) continue;
        mid.addVectors(a, b).multiplyScalar(0.5);
        if (preferZ) {
          side.set(-dir.y, dir.x, 0);
          if (side.lengthSq() < 1e-16) side.set(1, 0, 0);
        } else {
          view.subVectors(camPos, mid);
          side.crossVectors(dir, view);
          if (side.lengthSq() < 1e-16) side.set(-dir.y, dir.x, 0);
        }
        side.normalize().multiplyScalar(half);
        const a1x = a.x + side.x, a1y = a.y + side.y, a1z = a.z + side.z;
        const a2x = a.x - side.x, a2y = a.y - side.y, a2z = a.z - side.z;
        const b1x = b.x + side.x, b1y = b.y + side.y, b1z = b.z + side.z;
        const b2x = b.x - side.x, b2y = b.y - side.y, b2z = b.z - side.z;
        put(a1x, a1y, a1z); put(b1x, b1y, b1z); put(a2x, a2y, a2z);
        put(a2x, a2y, a2z); put(b1x, b1y, b1z); put(b2x, b2y, b2z);
      }
      if (nvert === 0) return null;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, nvert * 3), 3));
      const mat = new THREE.MeshBasicMaterial({
        color,
        depthTest: true,
        depthWrite: false,
        transparent: false,
        side: THREE.DoubleSide,
        toneMapped: false,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.renderOrder = 1001;
      mesh.frustumCulled = false;
      mesh.userData.isFatOutline = true;
      return mesh;
    }

    function refreshFatOutlineWidths(force) {
      if (!selectionOutlineGroup || !_fatOutlineEdges || !_fatOutlineEdges.length) return;
      const at = controls ? controls.target : new THREE.Vector3();
      const wpp = getWorldUnitsPerPixel(at);
      if (!force && _fatOutlinePixelSize && Math.abs(wpp - _fatOutlinePixelSize) / _fatOutlinePixelSize < 0.08) {
        if (appState.viewMode === 'top') return;
      }
      const isLight = appState.bgTheme === 'light';
      const borderColor = isLight ? 0x111827 : 0xFFFFFF;
      const olds = [];
      selectionOutlineGroup.children.forEach(ch => {
        if (ch.userData && ch.userData.isFatOutline) olds.push(ch);
      });
      olds.forEach(ch => {
        selectionOutlineGroup.remove(ch);
        if (ch.geometry) ch.geometry.dispose();
        if (ch.material) ch.material.dispose();
      });
      const fat = _makeFatRibbonMesh(_fatOutlineEdges, borderColor, 2.8, at);
      if (fat) selectionOutlineGroup.add(fat);
      _fatOutlinePixelSize = wpp;
    }


    function _makeSelectionBoundingBox(box, color) {
      const min = box.min, max = box.max;
      const corners = [
        [min.x, min.y, min.z], [max.x, min.y, min.z],
        [max.x, max.y, min.z], [min.x, max.y, min.z],
        [min.x, min.y, max.z], [max.x, min.y, max.z],
        [max.x, max.y, max.z], [min.x, max.y, max.z]
      ];
      const edges = [
        [0, 1], [1, 2], [2, 3], [3, 0],
        [4, 5], [5, 6], [6, 7], [7, 4],
        [0, 4], [1, 5], [2, 6], [3, 7]
      ];
      const arr = new Float32Array(edges.length * 6);
      for (let i = 0; i < edges.length; i++) {
        const a = corners[edges[i][0]];
        const b = corners[edges[i][1]];
        const o = i * 6;
        arr[o] = a[0]; arr[o + 1] = a[1]; arr[o + 2] = a[2];
        arr[o + 3] = b[0]; arr[o + 4] = b[1]; arr[o + 5] = b[2];
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      if (geom.computeLineDistances) geom.computeLineDistances();
      const diag = min.distanceTo(max);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const wpp = getWorldUnitsPerPixel(center);
      const dash = Math.max(diag * 0.045, wpp * 10);
      const mat = new THREE.LineDashedMaterial({
        color,
        dashSize: dash,
        gapSize: dash * 0.65,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 0.95,
        toneMapped: false
      });
      const lines = new THREE.LineSegments(geom, mat);
      lines.renderOrder = 1020;
      lines.frustumCulled = false;
      lines.userData.isSelectionBox = true;
      return lines;
    }

    function computeSelectionWorldBox(selectedIdSet, records) {
      const box = new THREE.Box3();
      let found = false;
      if (dxfRootGroup && selectedIdSet && selectedIdSet.size > 0) {
        const va = new THREE.Vector3();
        dxfRootGroup.updateMatrixWorld(true);
        dxfRootGroup.traverse(obj => {
          const pids = obj.userData && obj.userData.pickIds;
          if (!pids || !obj.geometry) return;
          const pos = obj.geometry.getAttribute('position');
          if (!pos) return;
          const mw = obj.matrixWorld;
          const n = Math.min(pos.count, pids.length);
          for (let i = 0; i < n; i++) {
            if (!selectedIdSet.has(pids[i])) continue;
            va.fromBufferAttribute(pos, i).applyMatrix4(mw);
            if (!Number.isFinite(va.x) || !Number.isFinite(va.y) || !Number.isFinite(va.z)) continue;
            box.expandByPoint(va);
            found = true;
          }
        });
      }
      if (!found && records && records.length) {
        records.forEach(r => {
          if (r && r.box && !r.box.isEmpty()) box.union(r.box);
        });
        found = !box.isEmpty();
      }
      return found ? box : null;
    }

    function addSelectionBoundingBoxes(group, records, selectedIdSet) {
      if (!group) return;
      const raw = computeSelectionWorldBox(selectedIdSet, records);
      if (!raw || raw.isEmpty()) return;
      const isLight = appState.bgTheme === 'light';
      const color = isLight ? 0x8B5CF6 : 0xC4B5FD;
      const box = raw.clone();
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const wpp = getWorldUnitsPerPixel(center);
      const pad = Math.min(Math.max(size.x, size.y, size.z) * 0.015, wpp * 8) + wpp * 3;
      box.expandByScalar(pad);
      group.add(_makeSelectionBoundingBox(box, color));
    }

    function updateSelectionOutlines(selectedIdSet) {
      disposeSelectionOutlines();
      if (!scene) return;
      const records = (appState.selectedRecords || []).filter(Boolean);
      const hasSel = (selectedIdSet && selectedIdSet.size > 0) || records.length > 0;
      if (!hasSel) return;

      selectionOutlineGroup = new THREE.Group();
      selectionOutlineGroup.name = 'SelectionOutline';
      selectionOutlineGroup.renderOrder = 1000;
      // Additive highlight overlay for selected 3D solids (drawn under the outlines).
      const solidHighlight = _buildSelected3DHighlight(selectedIdSet);
      if (solidHighlight) selectionOutlineGroup.add(solidHighlight);
      addSelectionBoundingBoxes(selectionOutlineGroup, records, selectedIdSet);
      if (selectionOutlineGroup.children.length) {
        scene.add(selectionOutlineGroup);
      } else {
        selectionOutlineGroup = null;
      }
    }

    function t(key, ...args) {
      const dict = I18N[appState.lang] || I18N.zh;
      const val = dict[key];
      return typeof val === 'function' ? val(...args) : (val || key);
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function escapeHtml(str) {
      return String(str === undefined || str === null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setFileNameDisplay(name) {
      appState.currentFileName = name;
      const badge = document.getElementById('currentFileNameBadge');
      if (badge) {
        badge.textContent = name;
        badge.title = name;
      }
    }

    function updateLoadingProgressUI(visible, percent = 0, stage = '', detail = '') {
      const card = document.getElementById('loadingOverlayCard');
      const topTrack = document.getElementById('topProgressTrack');
      const topFill = document.getElementById('topProgressFill');
      const barFill = document.getElementById('loadingBarFill');
      const pctText = document.getElementById('loadingPercentText');
      const stageTitle = document.getElementById('loadingStageTitle');
      const detailText = document.getElementById('loadingDetailText');

      if (!visible) {
        if (card) card.classList.add('hidden');
        if (topTrack) topTrack.classList.add('hidden');
        return;
      }
      if (card) card.classList.remove('hidden');
      if (topTrack) topTrack.classList.remove('hidden');
      const clamped = Math.max(0, Math.min(100, Math.round(percent)));
      if (topFill) topFill.style.width = `${clamped}%`;
      if (barFill) barFill.style.width = `${clamped}%`;
      if (pctText) pctText.textContent = `${clamped}%`;
      if (stage && stageTitle) stageTitle.textContent = stage;
      if (detailText) detailText.textContent = detail || '';
    }

    /**
     * OrbitControls: left pick/box, middle pan, right rotate in 3D; 2D locks rotation (right also pans).
     */
    function createCleanOrbitControls(camera, domElement, targetVec) {
      if (controls) {
        controls.dispose();
      }
      controls = new THREE.OrbitControls(camera, domElement);
      controls.enableDamping = false;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.15;
      controls.panSpeed = 1.0;
      controls.rotateSpeed = 0.85;

      const is2D = (appState.viewMode === 'top');
      controls.enableRotate = !is2D;
      // Wheel zoom is handled by zoomTowardPointer so it stays under the cursor.
      controls.enableZoom = false;
      // Left: pick / box; middle: pan; right: 2D pan, 3D custom orbit around cursor.
      controls.mouseButtons = {
        LEFT: -1,
        MIDDLE: THREE.MOUSE.PAN,
        RIGHT: is2D ? THREE.MOUSE.PAN : -1
      };

      controls.enabled = true;
      if (targetVec) {
        controls.target.copy(targetVec);
      }
      controls.update();
    }

    function setInteractionMode(_mode) {
      // Unified AutoCAD gestures: no pick/box mode toggle; keep as no-op for compatibility.
      appState.interactionMode = 'unified';
      if (controls) controls.enabled = true;
    }

    function initThreeViewport() {
      const container = document.getElementById('threeCanvasContainer');
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 600;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xFFFFFF);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 0.82);
      hemiLight.position.set(0, 0, 300);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.65);
      dirLight1.position.set(160, -180, 260);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
      dirLight2.position.set(-160, 140, -120);
      scene.add(dirLight2);

      const aspect = w / Math.max(1, h);
      perspCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 10000000);
      perspCamera.position.set(0, 0, 220);
      perspCamera.up.set(0, 1, 0);

      const frustumSize = 180;
      orthoCamera = new THREE.OrthographicCamera(
        (-frustumSize * aspect) / 2,
        (frustumSize * aspect) / 2,
        frustumSize / 2,
        -frustumSize / 2,
        -100000,
        100000
      );
      orthoCamera.position.set(0, 0, 220);
      orthoCamera.up.set(0, 1, 0);

      activeCamera = orthoCamera;

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      // Correct colour management: CAD colours are authored in sRGB, so the
      // renderer must re-encode them on output, otherwise every layer colour
      // looks washed out compared to AutoCAD. Guarded for older three.js
      // builds that still use `outputEncoding`.
      try {
        if ('outputColorSpace' in renderer && THREE.SRGBColorSpace !== undefined) {
          renderer.outputColorSpace = THREE.SRGBColorSpace;
        } else if (renderer.outputEncoding !== undefined && THREE.sRGBEncoding !== undefined) {
          renderer.outputEncoding = THREE.sRGBEncoding;
        }
        if ('toneMapping' in renderer && THREE.NoToneMapping !== undefined) {
          // ACES tone mapping desaturates the vivid ACI colours, so keep it off.
          renderer.toneMapping = THREE.NoToneMapping;
        }
      } catch (e) {
        console.warn('Colour management setup skipped:', e && e.message);
      }
      if ('setPixelRatio' in renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
      }
      renderer.setSize(w, h);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      createCleanOrbitControls(activeCamera, renderer.domElement, new THREE.Vector3(0, 0, 0));

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      renderer.domElement.addEventListener('click', onViewportClick);
      renderer.domElement.addEventListener('wheel', onViewportWheel, { passive: false });
      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('resize', onWindowResize);

      window.addEventListener('dragover', (e) => { e.preventDefault(); });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadUploadedFile(file);
      });

      animateLoop();
    }

    function animateLoop() {
      requestAnimationFrame(animateLoop);
      if (selectionOutlineGroup && _fatOutlineEdges) {
        refreshFatOutlineWidths(false);
      }
      if (renderer && scene && activeCamera) {
        renderer.render(scene, activeCamera);
      }
    }

    function onWindowResize() {
      const container = document.getElementById('threeCanvasContainer');
      if (!container || !renderer) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w <= 0 || h <= 0) return;

      const aspect = w / h;
      perspCamera.aspect = aspect;
      perspCamera.updateProjectionMatrix();

      const frustumH = orthoCamera.top - orthoCamera.bottom;
      orthoCamera.left = (-frustumH * aspect) / 2;
      orthoCamera.right = (frustumH * aspect) / 2;
      orthoCamera.updateProjectionMatrix();

      renderer.setSize(w, h);
    }

    // =========================================================================
    // Pointer & AutoCAD Window / Crossing Box Selection
    // =========================================================================
    function onPointerDown(e) {
      if (e.button === 2 && controls && controls.enableRotate && appState.viewMode === 'iso') {
        e.preventDefault();
        const pivot = pickPivotUnderPointer(e.clientX, e.clientY);
        if (pivot) {
          cadOrbit.active = true;
          cadOrbit.pivot.copy(pivot);
          cadOrbit.lastX = e.clientX;
          cadOrbit.lastY = e.clientY;
          if (renderer.domElement.setPointerCapture) {
            try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          }
        }
        return;
      }
      if (e.button !== 0) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerDragState.isDown = true;
      pointerDragState.downX = e.clientX - rect.left;
      pointerDragState.downY = e.clientY - rect.top;
      pointerDragState.curX = pointerDragState.downX;
      pointerDragState.curY = pointerDragState.downY;
      pointerDragState.boxActive = false;
      pointerDragState.pendingBox = true;
      // Do NOT disable OrbitControls here — wheel zoom must keep working during box drag.
    }

    function updateBoxOverlayDOM() {
      const overlay = document.getElementById('selectionBoxOverlay');
      if (!overlay) return;

      const x0 = Math.min(pointerDragState.downX, pointerDragState.curX);
      const y0 = Math.min(pointerDragState.downY, pointerDragState.curY);
      const w = Math.abs(pointerDragState.curX - pointerDragState.downX);
      const h = Math.abs(pointerDragState.curY - pointerDragState.downY);
      const isWindowMode = pointerDragState.curX >= pointerDragState.downX;

      overlay.style.left = `${x0}px`;
      overlay.style.top = `${y0}px`;
      overlay.style.width = `${w}px`;
      overlay.style.height = `${h}px`;

      if (isWindowMode) {
        overlay.style.border = '1.5px solid #2563EB';
        overlay.style.backgroundColor = 'rgba(37, 99, 235, 0.12)';
      } else {
        overlay.style.border = '1.5px dashed #10B981';
        overlay.style.backgroundColor = 'rgba(16, 185, 129, 0.14)';
      }
    }

    function onPointerMove(e) {
      lastPointerEvent = e;
      if (cadOrbit.active) {
        const dx = e.clientX - cadOrbit.lastX;
        const dy = e.clientY - cadOrbit.lastY;
        cadOrbit.lastX = e.clientX;
        cadOrbit.lastY = e.clientY;
        rotateAroundPivot(dx, dy, cadOrbit.pivot);
        return;
      }
      if (pointerDragState.isDown && renderer) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointerDragState.curX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        pointerDragState.curY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
        if (pointerDragState.pendingBox && !pointerDragState.boxActive) {
          const dx0 = Math.abs(pointerDragState.curX - pointerDragState.downX);
          const dy0 = Math.abs(pointerDragState.curY - pointerDragState.downY);
          if (dx0 >= 4 || dy0 >= 4) {
            pointerDragState.boxActive = true;
            const overlay = document.getElementById('selectionBoxOverlay');
            if (overlay) overlay.classList.remove('hidden');
          }
        }
        if (pointerDragState.boxActive) {
          updateBoxOverlayDOM();
        }
      }

      if (pointerRafPending) return;
      pointerRafPending = true;
      requestAnimationFrame(() => {
        pointerRafPending = false;
        if (!lastPointerEvent || !renderer) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((lastPointerEvent.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((lastPointerEvent.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, activeCamera);
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(planeZ, hit)) {
          const shift = (appState.parsedResult && appState.parsedResult.originShift) || { x: 0, y: 0, z: 0 };
          const readout = document.getElementById('cursorCoordsReadout');
          if (readout) {
            readout.textContent = `X: ${(hit.x + shift.x).toFixed(2)}  Y: ${(hit.y + shift.y).toFixed(2)}`;
          }
        }
      });
    }

    function onPointerUp(e) {
      if (cadOrbit.active) {
        cadOrbit.active = false;
        if (renderer && renderer.domElement.releasePointerCapture) {
          try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        }
        return;
      }
      if (!pointerDragState.isDown) return;
      pointerDragState.isDown = false;
      pointerDragState.pendingBox = false;
      const dx = Math.abs(pointerDragState.curX - pointerDragState.downX);
      const dy = Math.abs(pointerDragState.curY - pointerDragState.downY);

      if (pointerDragState.boxActive) {
        pointerDragState.boxActive = false;
        const overlay = document.getElementById('selectionBoxOverlay');
        if (overlay) overlay.classList.add('hidden');
        // Keep controls.enabled = true so wheel zoom never drops out of box select.

        if (dx >= 4 || dy >= 4) {
          pointerDragState.suppressNextClick = true;
          setTimeout(() => { pointerDragState.suppressNextClick = false; }, 80);
          performBoxSelection(
            pointerDragState.downX,
            pointerDragState.downY,
            pointerDragState.curX,
            pointerDragState.curY
          );
        }
      } else if (dx > 5 || dy > 5) {
        // Accidental drag without box activation — suppress click-selection
        pointerDragState.suppressNextClick = true;
        setTimeout(() => { pointerDragState.suppressNextClick = false; }, 60);
      }
      // Small movement: leave click event for point pick
    }

    // =========================================================================
    // Exact 2D Screen-Space Geometry Math for Precision Point & Crossing Selection
    // =========================================================================
    function distToSegmentSq2D(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 < 1e-6) return (px - x1) * (px - x1) + (py - y1) * (py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      return (px - projX) * (px - projX) + (py - projY) * (py - projY);
    }

    function pointInTriangle2D(px, py, x0, y0, x1, y1, x2, y2) {
      const dX = px - x2, dY = py - y2;
      const dX21 = x2 - x1, dY12 = y1 - y2;
      const D = dY12 * (x0 - x2) + dX21 * (y0 - y2);
      if (Math.abs(D) < 1e-7) return false;
      const s = dY12 * dX + dX21 * dY;
      const t = (y2 - y0) * dX + (x0 - x2) * dY;
      if (D < 0) return s <= 0.01 && t <= 0.01 && s + t >= D - 0.01;
      return s >= -0.01 && t >= -0.01 && s + t <= D + 0.01;
    }

    function segmentIntersectsRect2D(x1, y1, x2, y2, minX, minY, maxX, maxY) {
      if ((x1 >= minX && x1 <= maxX && y1 >= minY && y1 <= maxY) ||
          (x2 >= minX && x2 <= maxX && y2 >= minY && y2 <= maxY)) return true;
      if (Math.max(x1, x2) < minX || Math.min(x1, x2) > maxX ||
          Math.max(y1, y2) < minY || Math.min(y1, y2) > maxY) return false;
      const dx = x2 - x1, dy = y2 - y1;
      let t0 = 0, t1 = 1;
      const p = [-dx, dx, -dy, dy];
      const q = [x1 - minX, maxX - x1, y1 - minY, maxY - y1];
      for (let i = 0; i < 4; i++) {
        if (Math.abs(p[i]) < 1e-9) {
          if (q[i] < 0) return false;
        } else {
          const r = q[i] / p[i];
          if (p[i] < 0) {
            if (r > t1) return false;
            if (r > t0) t0 = r;
          } else {
            if (r < t0) return false;
            if (r < t1) t1 = r;
          }
        }
      }
      return t0 <= t1;
    }

    function performBoxSelection(x1, y1, x2, y2) {
      if (!appState.parsedResult || !appState.parsedResult.pickRecords || !renderer) return;
      const isWindow = x2 >= x1;
      const minX = Math.min(x1, x2);
      const maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2);
      const maxY = Math.max(y1, y2);

      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 600;

      const records = appState.parsedResult.pickRecords;
      const layers = appState.parsedResult.layers;
      const matchedIds = new Set();
      const partialCrossingCandidates = new Set();

      const corners = [
        new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(),
        new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
      ];

      for (let i = 0; i < records.length; i++) {
        const rec = records[i];
        if (rec.isNestedText) continue;
        const lg = layers[rec.layer];
        if (lg && !lg.visible) continue;

        const b = rec.box;
        if (!b || b.isEmpty()) continue;

        corners[0].set(b.min.x, b.min.y, b.min.z);
        corners[1].set(b.max.x, b.min.y, b.min.z);
        corners[2].set(b.max.x, b.max.y, b.min.z);
        corners[3].set(b.min.x, b.max.y, b.min.z);
        corners[4].set(b.min.x, b.min.y, b.max.z);
        corners[5].set(b.max.x, b.min.y, b.max.z);
        corners[6].set(b.max.x, b.max.y, b.max.z);
        corners[7].set(b.min.x, b.max.y, b.max.z);

        let eMinX = Infinity, eMinY = Infinity, eMaxX = -Infinity, eMaxY = -Infinity;
        for (let c = 0; c < 8; c++) {
          const v = corners[c].project(activeCamera);
          const sx = (v.x * 0.5 + 0.5) * width;
          const sy = (-v.y * 0.5 + 0.5) * height;
          if (sx < eMinX) eMinX = sx;
          if (sy < eMinY) eMinY = sy;
          if (sx > eMaxX) eMaxX = sx;
          if (sy > eMaxY) eMaxY = sy;
        }

        const strictlyInside = (eMinX >= minX && eMaxX <= maxX && eMinY >= minY && eMaxY <= maxY);
        if (strictlyInside) {
          matchedIds.add(rec.id);
        } else if (!isWindow && eMaxX >= minX && eMinX <= maxX && eMaxY >= minY && eMinY <= maxY) {
          partialCrossingCandidates.add(rec.id);
        }
      }

      // For Crossing mode (Right->Left), verify actual segment/triangle intersection so hollow outer rectangles aren't falsely selected!
      if (!isWindow && partialCrossingCandidates.size > 0 && dxfRootGroup) {
        const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
        dxfRootGroup.traverse(obj => {
          if (!obj.visible || (obj.parent && !obj.parent.visible)) return;
          if (!obj.geometry || !obj.userData || !obj.userData.pickIds) return;
          const posAttr = obj.geometry.getAttribute('position');
          if (!posAttr) return;
          const pos = posAttr.array;
          const pids = obj.userData.pickIds;

          if (obj.isLineSegments) {
            for (let v = 0; v < pids.length; v += 2) {
              const pid = pids[v];
              if (!partialCrossingCandidates.has(pid) || matchedIds.has(pid)) continue;
              const i0 = v * 3, i1 = (v + 1) * 3;
              vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
              vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
              const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
              const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
              if (segmentIntersectsRect2D(sx0, sy0, sx1, sy1, minX, minY, maxX, maxY)) {
                matchedIds.add(pid);
              }
            }
          } else if (obj.isMesh) {
            for (let v = 0; v < pids.length; v += 3) {
              const pid = pids[v];
              if (!partialCrossingCandidates.has(pid) || matchedIds.has(pid)) continue;
              const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
              vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
              vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
              vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
              const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
              const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
              const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;
              if (segmentIntersectsRect2D(sx0, sy0, sx1, sy1, minX, minY, maxX, maxY) ||
                  segmentIntersectsRect2D(sx1, sy1, sx2, sy2, minX, minY, maxX, maxY) ||
                  segmentIntersectsRect2D(sx2, sy2, sx0, sy0, minX, minY, maxX, maxY) ||
                  pointInTriangle2D((minX + maxX) * 0.5, (minY + maxY) * 0.5, sx0, sy0, sx1, sy1, sx2, sy2)) {
                matchedIds.add(pid);
              }
            }
          }
        });
      }

      const matched = records.filter(r => !r.isNestedText && matchedIds.has(r.id));
      appState.multiSelectBackup = null;
      appState.multiTypeFilter = 'ALL';
      setSelectedRecords(matched);
    }

    /**
     * Precision CAD Point Picker ("点选不准，会被挡住，比如多段线，矩形")
     * Tests exact screen-space pixel distance to rendered line segments, text quads, and 3D/2D triangles
     * rather than selecting by hollow bounding boxes!
     */
    function onViewportClick(e) {
      if (pointerDragState.suppressNextClick) return;
      if (!appState.parsedResult || !appState.parsedResult.pickRecords || !renderer || !dxfRootGroup) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width || 800;
      const height = rect.height || 600;
      const clickPxX = e.clientX - rect.left;
      const clickPxY = e.clientY - rect.top;

      mouse.x = (clickPxX / width) * 2 - 1;
      mouse.y = -(clickPxY / height) * 2 + 1;
      raycaster.setFromCamera(mouse, activeCamera);

      const ray = raycaster.ray;
      const records = appState.parsedResult.pickRecords;
      const layers = appState.parsedResult.layers;

      const worldWidth = ((orthoCamera.right - orthoCamera.left) / orthoCamera.zoom) || 100;
      const pickRadiusPx = 9.0;
      const pickRadiusSq = pickRadiusPx * pickRadiusPx;
      const worldTol = Math.max(0.5, (worldWidth / width) * (pickRadiusPx + 4.0));
      const padVec = new THREE.Vector3(worldTol, worldTol, worldTol + 8.0);

      // 1. Broad-phase filter: collect candidate records whose expanded Box3 intersects the click ray
      const candidateMap = new Map();
      const tmpBox = new THREE.Box3();
      for (let i = 0; i < records.length; i++) {
        const rec = records[i];
        const lg = layers[rec.layer];
        if (lg && !lg.visible) continue;
        tmpBox.copy(rec.box).expandByVector(padVec);
        if (ray.intersectsBox(tmpBox)) {
          candidateMap.set(rec.id, rec);
        }
      }

      if (candidateMap.size === 0) {
        appState.multiSelectBackup = null;
        appState.multiTypeFilter = 'ALL';
        setSelectedRecords([]);
        return;
      }

      // 2. Narrow-phase exact geometry hit testing in screen pixel space
      let bestEdgeRec = null;
      let bestEdgeDistSq = pickRadiusSq;
      let bestEdgeBoxDiag = Infinity;

      let bestTextRec = null;
      let bestTextDistSq = pickRadiusSq;
      let bestTextBoxDiag = Infinity;

      let bestSolid3DRec = null;
      let bestSolid3DDepth = Infinity;

      let bestHatchRec = null;
      let bestHatchBoxDiag = Infinity;

      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      const szVec = new THREE.Vector3();
      const getDiag = (r) => {
        if (!r || !r.box) return Infinity;
        r.box.getSize(szVec);
        return szVec.length();
      };

      dxfRootGroup.traverse(obj => {
        if (!obj.visible || (obj.parent && !obj.parent.visible)) return;
        if (!obj.geometry || !obj.userData || !obj.userData.pickIds) return;
        const posAttr = obj.geometry.getAttribute('position');
        if (!posAttr) return;
        const pos = posAttr.array;
        const pids = obj.userData.pickIds;

        if (obj.isLineSegments) {
          // Test actual rendered line/curve/polyline/rectangle/circle segments
          for (let v = 0; v < pids.length; v += 2) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const dSq = distToSegmentSq2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1);

            if (dSq <= pickRadiusSq) {
              const isHatch = rec.entity && (rec.entity.type === 'HATCH' || rec.entity.type === 'MPOLYGON');
              if (isHatch) {
                const diag = getDiag(rec);
                if (diag < bestHatchBoxDiag) {
                  bestHatchBoxDiag = diag;
                  bestHatchRec = rec;
                }
              } else {
                const diag = getDiag(rec);
                // If distances are within 1.5px of each other, prefer the smaller/more specific entity; otherwise closest edge wins!
                if (dSq + 2.25 < bestEdgeDistSq || (Math.abs(dSq - bestEdgeDistSq) <= 2.25 && diag < bestEdgeBoxDiag)) {
                  bestEdgeDistSq = dSq;
                  bestEdgeBoxDiag = diag;
                  bestEdgeRec = rec;
                }
              }
            }
          }
        } else if (obj.isMesh && obj.name && obj.name.startsWith('Batched_Text_Atlas')) {
          // Test rendered text quads
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const diag = getDiag(rec);
              if (diag < bestTextBoxDiag) {
                bestTextDistSq = 0;
                bestTextBoxDiag = diag;
                bestTextRec = rec;
              }
            }
          }
        } else if (obj.isMesh && obj.name && obj.name.startsWith('BatchedMesh3D')) {
          // Test 3D solid triangles (choose frontmost closest to camera)
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const zAvg = (vA.z + vB.z + vC.z) / 3.0;
              if (zAvg < bestSolid3DDepth) {
                bestSolid3DDepth = zAvg;
                bestSolid3DRec = rec;
              }
            }
          }
        } else if (obj.isMesh && obj.name && obj.name.startsWith('BatchedMesh2D')) {
          // Test 2D filled triangles (thick polylines, SOLID, or HATCH fills)
          for (let v = 0; v < pids.length; v += 3) {
            const pid = pids[v];
            const rec = candidateMap.get(pid);
            if (!rec) continue;
            const i0 = v * 3, i1 = (v + 1) * 3, i2 = (v + 2) * 3;
            vA.set(pos[i0], pos[i0 + 1], pos[i0 + 2]).project(activeCamera);
            vB.set(pos[i1], pos[i1 + 1], pos[i1 + 2]).project(activeCamera);
            vC.set(pos[i2], pos[i2 + 1], pos[i2 + 2]).project(activeCamera);
            const sx0 = (vA.x * 0.5 + 0.5) * width, sy0 = (-vA.y * 0.5 + 0.5) * height;
            const sx1 = (vB.x * 0.5 + 0.5) * width, sy1 = (-vB.y * 0.5 + 0.5) * height;
            const sx2 = (vC.x * 0.5 + 0.5) * width, sy2 = (-vC.y * 0.5 + 0.5) * height;

            if (pointInTriangle2D(clickPxX, clickPxY, sx0, sy0, sx1, sy1, sx2, sy2)) {
              const isHatch = rec.entity && (rec.entity.type === 'HATCH' || rec.entity.type === 'MPOLYGON');
              if (!isHatch) {
                const diag = getDiag(rec);
                if (1.0 < bestEdgeDistSq || diag < bestEdgeBoxDiag) {
                  bestEdgeDistSq = 1.0;
                  bestEdgeBoxDiag = diag;
                  bestEdgeRec = rec;
                }
              } else {
                const diag = getDiag(rec);
                if (diag < bestHatchBoxDiag) {
                  bestHatchBoxDiag = diag;
                  bestHatchRec = rec;
                }
              }
            }
          }
        }
      });

      // Priority:
      // 1. Direct click on a Text quad or very close (< 4px) to an Edge
      // 2. Any Edge within the 9px pickbox aperture
      // 3. 3D Solid surface triangle
      // 4. Background Hatch fill (never blocks edges, polylines, rectangles, or text!)
      //
      // In the 3D (iso) view a solid surface is a large filled area, while the
      // wireframe edges that belong to it are thin and sit right on the
      // silhouette. Picking the edge first would therefore select the outline
      // instead of the solid the user actually aimed at, so in 3D the solid
      // surface wins over a nearby edge (text still wins over both).
      let winner = null;
      const preferSolid3D = appState.viewMode === 'iso' && bestSolid3DRec;
      if (bestTextRec && (!bestEdgeRec || bestEdgeDistSq > 9.0 || bestTextBoxDiag < bestEdgeBoxDiag)) {
        winner = bestTextRec;
      } else if (preferSolid3D && (!bestEdgeRec || bestEdgeDistSq > 4.0)) {
        winner = bestSolid3DRec;
      } else if (bestEdgeRec) {
        winner = bestEdgeRec;
      } else if (bestTextRec) {
        winner = bestTextRec;
      } else if (bestSolid3DRec) {
        winner = bestSolid3DRec;
      } else if (bestHatchRec) {
        winner = bestHatchRec;
      }

      appState.multiSelectBackup = null;
      appState.multiTypeFilter = 'ALL';
      setSelectedRecords(winner ? [winner] : []);
    }

    // =========================================================================
    // Entity Color Highlighting ("高亮改成颜色高亮，而不是包围盒")
    // =========================================================================
    function setSelectedRecords(records) {
      appState.selectedRecords = records || [];

      const badge = document.getElementById('selectionCountBadge');
      if (badge) {
        if (appState.selectedRecords.length === 0) {
          badge.textContent = t('unselectedBadge');
          badge.className = 'text-slate-400';
        } else {
          badge.textContent = t('selectedCountBadge', appState.selectedRecords.length);
          badge.className = 'text-blue-600 font-semibold';
        }
      }

      const selectedIdSet = new Set();
      appState.selectedRecords.forEach(r => {
        if (r && r.id !== undefined && r.id >= 0) selectedIdSet.add(r.id);
      });

      if (dxfRootGroup) {
        window.DXFLoader.applyBackgroundTheme(dxfRootGroup, appState.bgTheme, selectedIdSet);
      }
      updateSelectionOutlines(selectedIdSet);

      renderPropertyPanel();
    }

    function zoomToBox(box) {
      if (!box || box.isEmpty() || !activeCamera || !renderer) return;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);

      const span = Math.max(size.x, size.y, size.z, 6.0);
      if (activeCamera === orthoCamera) {
        const baseFrustumH = orthoCamera.top - orthoCamera.bottom;
        const targetFrustumH = span * 2.8;
        orthoCamera.zoom = Math.max(0.05, Math.min(200, baseFrustumH / Math.max(1e-3, targetFrustumH)));
        orthoCamera.updateProjectionMatrix();
      }

      const offsetDir = new THREE.Vector3().subVectors(activeCamera.position, controls ? controls.target : new THREE.Vector3(0, 0, -1));
      if (offsetDir.lengthSq() < 1e-6) offsetDir.set(0, 0, 200);
      activeCamera.position.copy(center).add(offsetDir);
      if (controls) {
        controls.target.copy(center);
        controls.update();
      }
    }

    function zoomToSelectedRecords() {
      if (!appState.selectedRecords || appState.selectedRecords.length === 0) return;
      const unionBox = new THREE.Box3();
      appState.selectedRecords.forEach(r => {
        if (r && r.box && !r.box.isEmpty()) unionBox.union(r.box);
      });
      if (!unionBox.isEmpty()) zoomToBox(unionBox);
    }

    // =========================================================================
    // Standalone Fuzzy Search & Locate Engine (Text + Properties + Attributes)
    // =========================================================================
    function extractEntityPlainText(ent) {
      if (!ent) return '';
      if (ent.text) {
        return String(ent.text)
          .replace(/\\P/g, ' ')
          .replace(/\\[A-Za-z][^;]*;/g, '')
          .replace(/\{|\}/g, '')
          .trim();
      }
      if (ent.type === 'DIMENSION' && ent.actualMeasurement !== undefined) {
        return Number(ent.actualMeasurement).toFixed(2);
      }
      if (ent.type === 'INSERT') {
        const attrStr = (ent.attribs || []).map(a => `${a.tag || ''}:${a.text || ''}`).join(' ');
        return `${ent.name || ''} ${attrStr}`.trim();
      }
      return '';
    }

    /**
     * Multi-token & subsequence fuzzy matcher
     */
    function fuzzyMatch(haystack, query) {
      if (!query) return true;
      const hay = String(haystack || '').toLowerCase();
      const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
      for (const tok of tokens) {
        if (hay.includes(tok)) continue;
        // Subsequence fallback for abbreviations
        let hIdx = 0;
        let matchedAll = true;
        for (let c = 0; c < tok.length; c++) {
          hIdx = hay.indexOf(tok[c], hIdx);
          if (hIdx === -1) { matchedAll = false; break; }
          hIdx++;
        }
        if (!matchedAll) return false;
      }
      return true;
    }

    function rebuildSearchMatches() {
      if (!appState.parsedResult) {
        appState.searchMatches = [];
        appState.activeSearchMatchIdx = -1;
        renderSearchResultsUI();
        return;
      }

      const q = (appState.entitySearchQuery || '').trim();
      const cat = appState.entitySearchCategory || 'all';
      const matches = [];
      const seenKeys = new Set();

      // 1. Search rendered text records (`textRecords`)
      const textRecs = appState.parsedResult.textRecords || [];
      if (cat === 'all' || cat === 'text' || cat === 'dim') {
        for (let i = 0; i < textRecs.length; i++) {
          const tr = textRecs[i];
          if (cat === 'text' && tr.type === 'DIMENSION') continue;
          if (cat === 'dim' && tr.type !== 'DIMENSION' && tr.type !== 'LEADER' && tr.type !== 'MLEADER' && tr.type !== 'TOLERANCE') continue;

          const hay = `${tr.plainText} ${tr.type} ${tr.displayLayer || tr.layer} ${tr.parentBlock || ''} #${tr.handle || ''}`;
          if (fuzzyMatch(hay, q)) {
            const key = `T_${tr.id}`;
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              matches.push({
                badge: tr.type || 'TEXT',
                label: tr.plainText,
                subLabel: `${tr.displayLayer || tr.layer}${tr.parentBlock ? ' · 块:' + tr.parentBlock : ''}`,
                box: tr.box,
                pickRecord: tr.pickRecord || findPickRecordForEntity(tr.entity, tr.box, tr)
              });
              if (matches.length >= 200) break;
            }
          }
        }
      }

      // 2. Search entities by attributes, properties, block names, layer names, types, handles
      if (matches.length < 200 && (cat === 'all' || cat === 'prop' || cat === 'dim')) {
        const pickRecs = appState.parsedResult.pickRecords || [];
        for (let i = 0; i < pickRecs.length; i++) {
          const pr = pickRecs[i];
          if (pr.isNestedText) continue;
          const ent = pr.entity;
          if (!ent) continue;

          if (cat === 'dim' && ent.type !== 'DIMENSION' && ent.type !== 'LEADER' && ent.type !== 'MLEADER') continue;
          if (cat === 'prop' && (ent.type === 'TEXT' || ent.type === 'MTEXT')) continue;

          const plain = extractEntityPlainText(ent);
          const attrPairs = (ent.attribs || []).map(a => `${a.tag}=${a.text}`).join(' ');
          const handleStr = ent.handle ? `#${ent.handle}` : '';
          const propSummary = `${ent.type} ${plain} ${ent.name || ''} ${attrPairs} ${pr.displayLayer} ${ent.linetype || ''} ${ent.patternName || ''} ${handleStr}`;

          if (fuzzyMatch(propSummary, q)) {
            const label = plain || (ent.name ? `${ent.name} (${attrPairs || '块参照'})` : `${ent.type} ${handleStr}`);
            const key = `E_${pr.id}`;
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              matches.push({
                badge: ent.type,
                label,
                subLabel: `${pr.displayLayer} ${handleStr}`,
                box: pr.box,
                pickRecord: pr
              });
              if (matches.length >= 200) break;
            }
          }
        }
      }

      appState.searchMatches = matches;
      appState.activeSearchMatchIdx = matches.length > 0 ? 0 : -1;
      renderSearchResultsUI();
    }

    function findPickRecordForEntity(ent, fallbackBox, tr) {
      if (appState.parsedResult && appState.parsedResult.pickRecords && ent) {
        const found = appState.parsedResult.pickRecords.find(r => r.entity === ent);
        if (found) return found;
      }
      return {
        id: -1,
        isTopLevel: false,
        isNestedText: true,
        parentBlock: tr ? tr.parentBlock : null,
        plainText: tr ? tr.plainText : '',
        resolvedFont: tr ? tr.resolvedFont : null,
        entity: ent || { type: (tr && tr.type) || 'TEXT', text: (tr && tr.plainText) || '', layer: (tr && tr.layer) || '0' },
        layer: (tr && tr.layer) || '0',
        displayLayer: (tr && tr.displayLayer) || '0',
        colorPair: (tr && tr.colorPair) || { light: 0x0F172A, dark: 0xF8FAFC },
        box: fallbackBox
      };
    }

    function activateSearchMatch(index) {
      if (!appState.searchMatches || appState.searchMatches.length === 0) return;
      const len = appState.searchMatches.length;
      const idx = ((index % len) + len) % len;
      appState.activeSearchMatchIdx = idx;
      const item = appState.searchMatches[idx];
      renderSearchResultsUI();

      if (item && item.pickRecord) {
        if (appState.parsedResult && item.pickRecord.layer) {
          const lg = appState.parsedResult.layers[item.pickRecord.layer];
          if (lg && !lg.visible) {
            lg.visible = true;
            const stLayer = appState.parsedResult.stats.layers.find(l => l.name === item.pickRecord.layer);
            if (stLayer) stLayer.visible = true;
            updateLayerManagerUI(appState.parsedResult);
          }
        }
        const targetRec = Object.assign({}, item.pickRecord, { box: item.box || item.pickRecord.box });
        appState.multiSelectBackup = null;
        setSelectedRecords([targetRec]);
        zoomToBox(targetRec.box);
      }
    }

    function renderSearchResultsUI() {
      const listEl = document.getElementById('searchResultsList');
      const countEl = document.getElementById('searchMatchCount');
      const clearBtn = document.getElementById('btnClearEntitySearch');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !appState.entitySearchQuery);
      }
      if (!listEl) return;

      const total = appState.searchMatches.length;
      const cur = appState.activeSearchMatchIdx >= 0 ? (appState.activeSearchMatchIdx + 1) : 0;
      if (countEl) countEl.textContent = `${cur} / ${total}`;

      listEl.innerHTML = '';
      if (total === 0) {
        listEl.innerHTML = `<div class="text-[11px] text-slate-400 py-4 text-center">${escapeHtml(t('noSearchMatch'))}</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      appState.searchMatches.forEach((m, idx) => {
        const isActive = idx === appState.activeSearchMatchIdx;
        const row = document.createElement('div');
        row.className = isActive
          ? 'flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-blue-50 border border-blue-200 text-xs transition'
          : 'flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 text-xs transition';

        row.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 mono text-[10px] font-medium shrink-0">${escapeHtml(m.badge)}</span>
              <span class="font-medium text-slate-800 truncate">${escapeHtml(m.label)}</span>
            </div>
            <div class="text-[10px] text-slate-400 mono truncate mt-0.5">${escapeHtml(m.subLabel)}</div>
          </div>
          <span class="text-[11px] text-blue-600 font-medium shrink-0">${escapeHtml(t('locateShort'))}</span>
        `;
        row.addEventListener('click', () => activateSearchMatch(idx));
        frag.appendChild(row);
      });
      listEl.appendChild(frag);
    }

    // =========================================================================
    // Selected Object Property Panel ONLY ("属性面板只显示选择对象的属性，不要其他多余的")
    // =========================================================================
    function buildPropSectionHTML(title, rowsHtml) {
      return `
        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-2xs">
          <div class="px-3 py-1.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-700">
            ${escapeHtml(title)}
          </div>
          <div class="divide-y divide-slate-100">
            ${rowsHtml}
          </div>
        </div>
      `;
    }

    function buildPropRowHTML(label, valHtml, isMono = true) {
      return `
        <div class="px-3 py-1.5 flex items-start justify-between gap-2 text-[11px]">
          <span class="text-slate-500 shrink-0">${escapeHtml(label)}</span>
          <span class="${isMono ? 'mono' : ''} text-slate-800 font-medium text-right break-all">${valHtml}</span>
        </div>
      `;
    }

    function fmtVec3(x, y, z, shift = { x: 0, y: 0, z: 0 }) {
      const wx = (Number(x || 0) + (shift.x || 0)).toFixed(2);
      const wy = (Number(y || 0) + (shift.y || 0)).toFixed(2);
      const wz = (Number(z || 0) + (shift.z || 0)).toFixed(2);
      return `(${wx}, ${wy}, ${wz})`;
    }

    function renderPropertyPanel() {
      const headerEl = document.getElementById('lblPropPanelHeader');
      const btnZoom = document.getElementById('btnZoomSelected');
      const btnClear = document.getElementById('btnClearSelection');
      const bodyEl = document.getElementById('propertyPanelBody');
      if (!bodyEl || !appState.parsedResult) return;

      const res = appState.parsedResult;
      const dxf = res.dxf;
      const shift = res.originShift || { x: 0, y: 0, z: 0 };
      const sel = appState.selectedRecords || [];

      if (sel.length === 0) {
        if (headerEl) headerEl.textContent = t('propHeaderEmpty');
        if (btnZoom) btnZoom.classList.add('hidden');
        if (btnClear) btnClear.classList.add('hidden');
        bodyEl.innerHTML = `
          <div class="h-48 flex items-center justify-center text-center px-4 text-xs text-slate-400 whitespace-pre-line leading-relaxed">${escapeHtml(t('propEmptyHint'))}</div>
        `;
        return;
      }

      if (btnZoom) btnZoom.classList.remove('hidden');
      if (btnClear) btnClear.classList.remove('hidden');

      if (sel.length > 1) {
        if (headerEl) headerEl.textContent = t('multiPropsTitle', sel.length);

        const byTypeCount = {};
        const layerSet = new Set();
        const unionBox = new THREE.Box3();
        sel.forEach(r => {
          const tp = (r.entity && r.entity.type) || 'ENTITY';
          byTypeCount[tp] = (byTypeCount[tp] || 0) + 1;
          layerSet.add(r.displayLayer || r.layer || '0');
          if (r.box && !r.box.isEmpty()) unionBox.union(r.box);
        });

        const filteredSel = appState.multiTypeFilter === 'ALL'
          ? sel
          : sel.filter(r => ((r.entity && r.entity.type) || 'ENTITY') === appState.multiTypeFilter);

        const uSize = new THREE.Vector3();
        if (!unionBox.isEmpty()) unionBox.getSize(uSize);

        const curFilterLabel = appState.multiTypeFilter === 'ALL'
          ? `${appState.lang === 'zh' ? '全部类型' : 'All Types'} (${sel.length})`
          : `${appState.multiTypeFilter} (${byTypeCount[appState.multiTypeFilter] || 0})`;

        const filterMenuRows = [
          { val: 'ALL', label: `${appState.lang === 'zh' ? '全部类型' : 'All Types'} (${sel.length})` },
          ...Object.entries(byTypeCount).map(([tp, c]) => ({ val: tp, label: `${tp} (${c})` }))
        ].map(item => {
          const active = appState.multiTypeFilter === item.val;
          return `
            <button type="button" data-multi-type="${escapeHtml(item.val)}" class="w-full px-2.5 py-1.5 rounded-xl text-left text-xs font-medium ${active ? 'bg-blue-50 text-blue-600' : 'text-slate-700 hover:bg-slate-100'} transition flex items-center justify-between">
              <span>${escapeHtml(item.label)}</span>
              <span class="${active ? '' : 'hidden'} text-[11px] text-blue-600">✓</span>
            </button>
          `;
        }).join('');

        const filterBarHtml = `
          <div class="relative" id="multiTypeDropdownWrapper">
            <button type="button" id="btnMultiTypeDropdown" class="w-full px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/70 text-xs font-medium text-slate-800 transition flex items-center justify-between">
              <span>${escapeHtml(curFilterLabel)}</span>
              <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <div id="multiTypeDropdownMenu" class="hidden absolute left-0 right-0 mt-1 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-xl p-1 z-40 space-y-0.5 max-h-48 overflow-y-auto">
              ${filterMenuRows}
            </div>
          </div>
        `;

        const secSummary = buildPropSectionHTML(t('secMultiSummary'), [
          buildPropRowHTML(appState.lang === 'zh' ? '选中数量' : 'Selected', `${filteredSel.length} / ${sel.length}`),
          buildPropRowHTML(appState.lang === 'zh' ? '图层' : 'Layers', escapeHtml(Array.from(layerSet).slice(0, 4).join(', '))),
          buildPropRowHTML(appState.lang === 'zh' ? '尺寸 (W×H×D)' : 'Span (W×H×D)', `${uSize.x.toFixed(2)} × ${uSize.y.toFixed(2)} × ${uSize.z.toFixed(2)}`)
        ].join(''));

        const itemRows = filteredSel.slice(0, 100).map((r, idx) => {
          const ent = r.entity || {};
          const txt = extractEntityPlainText(ent);
          return `
            <button type="button" data-inspect-idx="${idx}" class="w-full px-3 py-1.5 flex items-center justify-between hover:bg-blue-50/80 transition text-left">
              <div class="min-w-0 pr-2 flex items-center gap-1.5">
                <span class="px-1.5 py-0.2 rounded bg-slate-100 text-slate-700 mono text-[10px] font-semibold shrink-0">${escapeHtml(ent.type || 'ENT')}</span>
                <span class="text-[11px] text-slate-700 truncate">${escapeHtml(txt || ent.name || ('#' + (ent.handle || '')) || r.displayLayer)}</span>
              </div>
              <span class="text-[11px] text-blue-600 shrink-0">${escapeHtml(t('locateShort'))}</span>
            </button>
          `;
        }).join('');

        const secList = buildPropSectionHTML(t('secMultiList'), itemRows);
        bodyEl.innerHTML = filterBarHtml + secSummary + secList;

        const btnMultiType = document.getElementById('btnMultiTypeDropdown');
        const menuMultiType = document.getElementById('multiTypeDropdownMenu');
        if (btnMultiType && menuMultiType) {
          btnMultiType.addEventListener('click', (ev) => {
            ev.stopPropagation();
            menuMultiType.classList.toggle('hidden');
          });
          menuMultiType.querySelectorAll('[data-multi-type]').forEach(b => {
            b.addEventListener('click', (ev) => {
              ev.stopPropagation();
              appState.multiTypeFilter = b.getAttribute('data-multi-type');
              menuMultiType.classList.add('hidden');
              renderPropertyPanel();
            });
          });
        }

        bodyEl.querySelectorAll('[data-inspect-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const ix = parseInt(btn.getAttribute('data-inspect-idx'), 10);
            const target = filteredSel[ix];
            if (target) {
              appState.multiSelectBackup = sel.slice();
              setSelectedRecords([target]);
              zoomToBox(target.box);
            }
          });
        });
        return;
      }

      // Single Selected Object Properties
      const rec = sel[0];
      const ent = rec.entity || {};
      if (headerEl) headerEl.textContent = t('entPropsTitle', ent.type || 'ENTITY');

      const backBannerHtml = (appState.multiSelectBackup && appState.multiSelectBackup.length > 1)
        ? `<button id="btnBackToMultiSelection" type="button" class="w-full py-1.5 px-2.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-medium text-left transition">${escapeHtml(t('backToMultiBtn'))} (${appState.multiSelectBackup.length})</button>`
        : '';

      const layerKey = rec.layer || (ent.layer ? String(ent.layer).toUpperCase() : '0');
      const layerObj = (dxf.tables && dxf.tables.layers && dxf.tables.layers[layerKey]) || {};
      const isLight = appState.bgTheme === 'light';
      const colPair = rec.colorPair || { light: 0x0F172A, dark: 0xF8FAFC };
      const activeHex = '#' + new THREE.Color(isLight ? colPair.light : colPair.dark).getHexString().toUpperCase();
      const colorLabel = (ent.trueColor !== null && ent.trueColor !== undefined)
        ? `#${(ent.trueColor & 0xFFFFFF).toString(16).padStart(6, '0').toUpperCase()}`
        : ((ent.colorIndex === undefined || ent.colorIndex === 256) ? `BYLAYER (ACI ${layerObj.colorIndex || 7})` : `ACI ${ent.colorIndex}`);

      const resolvedLtype = (!ent.linetype || ent.linetype.toUpperCase() === 'BYLAYER')
        ? `${layerObj.linetype || 'CONTINUOUS'}`
        : ent.linetype;

      const generalRows = [
        buildPropRowHTML(appState.lang === 'zh' ? '类型' : 'Type', escapeHtml(ent.type || 'ENTITY')),
        buildPropRowHTML(appState.lang === 'zh' ? '句柄' : 'Handle', ent.handle ? `#${escapeHtml(ent.handle)}` : '-'),
        buildPropRowHTML(appState.lang === 'zh' ? '图层' : 'Layer', escapeHtml(rec.displayLayer || ent.layer || '0')),
        buildPropRowHTML(
          appState.lang === 'zh' ? '颜色' : 'Color',
          `<span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block border border-slate-300" style="background:${activeHex}"></span>${escapeHtml(colorLabel)}</span>`
        ),
        buildPropRowHTML(appState.lang === 'zh' ? '线型' : 'Linetype', escapeHtml(resolvedLtype))
      ];
      if (Math.abs(ent.thickness || 0) > 1e-4) {
        generalRows.push(buildPropRowHTML(appState.lang === 'zh' ? '厚度' : 'Thickness', Number(ent.thickness).toFixed(2)));
      }
      if (rec.parentBlock) {
        generalRows.push(buildPropRowHTML(appState.lang === 'zh' ? '所属块' : 'Parent Block', escapeHtml(rec.parentBlock)));
      }
      const secGen = buildPropSectionHTML(t('secGeneral'), generalRows.join(''));

      const specRows = [];
      const tp = ent.type;

      if (tp === 'LINE') {
        const dx = (ent.x1 || 0) - (ent.x || 0);
        const dy = (ent.y1 || 0) - (ent.y || 0);
        const dz = (ent.z1 || 0) - (ent.z || 0);
        const len = Math.hypot(dx, dy, dz);
        let ang = (Math.atan2(dy, dx) * 180) / Math.PI;
        if (ang < 0) ang += 360;
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '起点' : 'Start', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '终点' : 'End', fmtVec3(ent.x1, ent.y1, ent.z1, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '长度' : 'Length', len.toFixed(3)),
          buildPropRowHTML(appState.lang === 'zh' ? '角度' : 'Angle', `${ang.toFixed(2)}°`)
        );
      } else if (tp === 'CIRCLE' || tp === 'ARC') {
        const r = Number(ent.r || 0);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '圆心' : 'Center', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '半径' : 'Radius', r.toFixed(3)),
          buildPropRowHTML(appState.lang === 'zh' ? '直径' : 'Diameter', `⌀${(r * 2).toFixed(3)}`)
        );
        if (tp === 'ARC') {
          specRows.push(
            buildPropRowHTML(appState.lang === 'zh' ? '起始角' : 'Start Angle', `${Number(ent.startAngle || 0).toFixed(2)}°`),
            buildPropRowHTML(appState.lang === 'zh' ? '终止角' : 'End Angle', `${Number(ent.endAngle || 360).toFixed(2)}°`)
          );
        }
      } else if (tp === 'ELLIPSE') {
        const majorR = Math.hypot(ent.x1 || 0, ent.y1 || 0, ent.z1 || 0);
        const ratio = Number(ent.ratio || 1);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '中心' : 'Center', fmtVec3(ent.x, ent.y, ent.z, shift)),

          buildPropRowHTML(appState.lang === 'zh' ? '坐标' : 'Position', fmtVec3(ent.x, ent.y, ent.z, shift))
        );
      } else if (tp === 'DIMENSION' || tp === 'LEADER' || tp === 'MLEADER') {
        const plain = rec.plainText || extractEntityPlainText(ent);
        specRows.push(
          buildPropRowHTML(appState.lang === 'zh' ? '标注内容' : 'Value', escapeHtml(plain || '-')),
          buildPropRowHTML(appState.lang === 'zh' ? '标注样式' : 'DimStyle', escapeHtml(ent.styleName || ent.dimstyle || 'STANDARD'))
        );
      } else if (tp === 'INSERT') {

          buildPropRowHTML(appState.lang === 'zh' ? '插入点' : 'Position', fmtVec3(ent.x, ent.y, ent.z, shift)),
          buildPropRowHTML(appState.lang === 'zh' ? '缩放' : 'Scale', `(${Number(ent.xscale ?? 1).toFixed(2)}, ${Number(ent.yscale ?? 1).toFixed(2)}, ${Number(ent.zscale ?? 1).toFixed(2)})`),
          buildPropRowHTML(appState.lang === 'zh' ? '旋转角' : 'Rotation', `${Number(ent.rotation || 0).toFixed(1)}°`)
        );
        if (ent.attribs && ent.attribs.length > 0) {
          ent.attribs.forEach(attr => {

      const b = rec.box || new THREE.Box3();

        buildPropRowHTML(appState.lang === 'zh' ? '尺寸' : 'Size', `${bSize.x.toFixed(2)} × ${bSize.y.toFixed(2)} × ${bSize.z.toFixed(2)}`)

      const secSpec = specRows.length > 0 ? buildPropSectionHTML(t('secSpecifics'), specRows.join('')) : '';
      bodyEl.innerHTML = backBannerHtml + secGen + secSpec + secBounds;

      const btnBack = document.getElementById('btnBackToMultiSelection');

    function applyThemeInstant(bgTheme) {
      if (bgTheme !== 'light' && bgTheme !== 'dark') bgTheme = 'dark';
      appState.bgTheme = bgTheme;
      updateThemeDropdownUI(bgTheme);
      if (!scene) return;
      const isLight = bgTheme === 'light';
      scene.background = new THREE.Color(isLight ? 0xFFFFFF : 0x000000);
      if (dxfRootGroup) {
        const selectedIdSet = new Set();
        (appState.selectedRecords || []).forEach(r => {
          if (r && r.id !== undefined && r.id >= 0) selectedIdSet.add(r.id);
        });
        window.DXFLoader.applyBackgroundTheme(dxfRootGroup, bgTheme, selectedIdSet);
        updateSelectionOutlines(selectedIdSet);
        if (appState.parsedResult) {
          updateLayerManagerUI(appState.parsedResult);
          renderPropertyPanel();
        }
      }
    }

    async function parseAndRenderCurrentDXFAsync(fitCamera = true) {
      if (!scene) return;
      const jobId = ++appState.parseJobId;

      updateLoadingProgressUI(true, 2, appState.lang === 'zh' ? '准备解析图纸...' : 'Preparing parser...', '');

      const isLight = appState.bgTheme === 'light';
      const loader = new window.DXFLoader();
      loader.setOptions({
        backgroundColor: isLight ? 'light' : 'dark',
        defaultColor: isLight ? 0x0F172A : 0xF8FAFC,
        centerOrigin: true
      });

      try {
        const result = await loader.parseAsync(appState.currentInput, null, (prog) => {
          if (jobId !== appState.parseJobId) return;
          updateLoadingProgressUI(true, prog.percent, prog.stage, prog.detail);
        });

        if (jobId !== appState.parseJobId) return;

        if (dxfRootGroup) {
          scene.remove(dxfRootGroup);
          disposeSceneGroup(dxfRootGroup);
          dxfRootGroup = null;
        }
        disposeSelectionOutlines();

        appState.parsedResult = result;
        appState.selectedRecords = [];
        appState.multiSelectBackup = null;
        dxfRootGroup = result.scene;
        scene.add(dxfRootGroup);

        applyThemeInstant(appState.bgTheme);
        updateLayerManagerUI(result);
        updateStatusBar(result);
        rebuildSearchMatches();
        setSelectedRecords([]);

        if (fitCamera) {
          const bbox = result.boundingBox;
          const sz = new THREE.Vector3();
          bbox.getSize(sz);
          const isPrimarily3D = appState.currentPresetKey.endsWith('_3d') ||
            (result.stats.has3D && sz.z > Math.max(sz.x, sz.y) * 0.18);
          fitViewToScene(isPrimarily3D ? 'iso' : 'top');
        }

        if (renderer && scene && activeCamera) {
          renderer.render(scene, activeCamera);
        }
      } finally {
        if (jobId === appState.parseJobId) {
          updateLoadingProgressUI(false);
        }
      }
    }

    function fitViewToScene(mode = 'top') {
      if (!appState.parsedResult) return;
      updateViewButtonsUI(mode);

      const bbox = appState.parsedResult.boundingBox;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      if (bbox.isEmpty()) {
        center.set(0, 0, 0);
        size.set(100, 100, 20);
      } else {
        bbox.getCenter(center);
        bbox.getSize(size);
      }

      const maxDim = Math.max(size.x, size.y, size.z, 10);
      const container = document.getElementById('threeCanvasContainer');
      const aspect = (container.clientWidth || 800) / Math.max(1, container.clientHeight || 600);

      const frustumH = maxDim * 1.22;
      orthoCamera.left = (-frustumH * aspect) / 2;
      orthoCamera.right = (frustumH * aspect) / 2;
      orthoCamera.top = frustumH / 2;
      orthoCamera.bottom = -frustumH / 2;
      orthoCamera.near = -Math.max(2000, maxDim * 8);
      orthoCamera.far = Math.max(2000, maxDim * 8);
      orthoCamera.zoom = 1;
      orthoCamera.updateProjectionMatrix();

      perspCamera.near = Math.max(0.1, maxDim * 0.0005);
      perspCamera.far = Math.max(10000, maxDim * 20);
      perspCamera.updateProjectionMatrix();

      const dist = maxDim * 1.6;
      if (mode === 'top') {
        activeCamera.up.set(0, 1, 0);
        activeCamera.position.set(center.x, center.y, center.z + dist);
      } else {
        activeCamera.up.set(0, 0, 1);
        activeCamera.position.set(center.x + dist * 0.78, center.y - dist * 0.88, center.z + dist * 0.68);
      }

      createCleanOrbitControls(activeCamera, renderer.domElement, center);
    }

    function getFilteredLayers(result) {
      if (!result || !result.stats || !result.stats.layers) return [];
      const q = (appState.layerFilterQuery || '').trim().toLowerCase();
      if (!q) return result.stats.layers;
      return result.stats.layers.filter(l =>
        (l.displayName || l.name || '').toLowerCase().includes(q) ||
        (l.name || '').toLowerCase().includes(q)
      );
    }

    function updateLayerManagerUI(result) {

      if (countEl) {
        countEl.textContent = appState.layerFilterQuery ? `${filtered.length}/${totalCount}` : String(totalCount);

        const left = document.createElement('label');
        left.className = 'flex items-center gap-2 truncate flex-1';

        const chk = document.createElement('button');
        chk.type = 'button';
        const setChkVisual = (vis) => {
          chk.className = vis
            ? 'w-4 h-4 rounded-[5px] bg-blue-600 text-white flex items-center justify-center shrink-0 transition shadow-2xs'
            : 'w-4 h-4 rounded-[5px] bg-white border border-slate-300 text-transparent flex items-center justify-center shrink-0 transition hover:border-slate-400';
          chk.innerHTML = '<svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
        };
        setChkVisual(layerInfo.visible);
        chk.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          layerInfo.visible = !layerInfo.visible;
          setChkVisual(layerInfo.visible);
          const lg = result.layers[layerInfo.name];
          if (lg) lg.visible = layerInfo.visible;
        });

        const swatch = document.createElement('span');
        swatch.className = 'w-2.5 h-2.5 rounded-full inline-block shrink-0 border border-slate-300';
        swatch.style.backgroundColor = '#' + new THREE.Color(layerInfo.colorHex).getHexString();

        const nameSpan = document.createElement('span');
        nameSpan.className = 'text-slate-700 truncate';
        nameSpan.textContent = layerInfo.displayName || layerInfo.name;

        left.appendChild(chk);
        left.appendChild(swatch);

        countBtn.type = 'button';
        countBtn.className = 'mono text-[10px] text-slate-400 hover:text-blue-600 shrink-0 ml-1 px-1 rounded';
        countBtn.textContent = String(layerInfo.entityCount);
        countBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const recs = (result.pickRecords || []).filter(r => !r.isNestedText && r.layer === layerInfo.name);
          if (recs.length > 0) {

            appState.multiTypeFilter = 'ALL';
            setSelectedRecords(recs);

        row.appendChild(left);

        frag.appendChild(row);
      });
